<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قصص لولو">
<meta name="theme-color" content="#BFE3FA">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>مكتبة قصص لولو</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Noto+Naskh+Arabic:wght@600;700&display=swap">
<style>
/* Layout: one-screen picture book. Scene card on top, reading strip below, big page arrows at the sides. */
:root{
  --sky:#CDEBFF; --grass:#8FD694; --grass2:#6CC07A; --wall:#FFE9C7; --floor:#E8B98A;
  --paper:#FFFDF7; --ink:#2A2550; --soft:#6E6A93; --berry:#7C4DFF; --berry-d:#5A2FD6;
  --sun:#FFC83D; --coral:#FF6B5B; --hl:#FFE066; --ok:#3CBF6E;
  --display:"Baloo Bhaijaan 2","Noto Naskh Arabic",Tahoma,sans-serif;
  --read:"Noto Naskh Arabic","Geeza Pro",Tahoma,serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:#BFE3FA;color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;gap:1.4vh;padding-block:1.6vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto}
.dots{display:flex;gap:8px;direction:rtl}
.dots i{width:12px;height:12px;border-radius:50%;background:#ffffff99;transition:background .3s,transform .3s}
.dots i.on{background:var(--berry);transform:scale(1.3)}
.rb{width:clamp(48px,7vmin,68px);aspect-ratio:1;border-radius:50%;border:none;background:var(--paper);font-size:clamp(22px,3.6vmin,32px);display:grid;place-items:center;box-shadow:0 4px 0 #00000018;cursor:pointer}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 #00000018}
.main{flex:1 1 auto;min-height:0;display:flex;flex-direction:row-reverse;align-items:center;gap:12px}
.arrow{flex:0 0 auto;width:clamp(56px,9vmin,90px);aspect-ratio:1;border-radius:50%;border:none;background:var(--berry);color:#fff;font-size:clamp(30px,5vmin,48px);box-shadow:0 6px 0 var(--berry-d);cursor:pointer;display:grid;place-items:center;transition:opacity .3s}
.arrow:active{transform:translateY(4px);box-shadow:0 2px 0 var(--berry-d)}
.arrow[disabled]{opacity:0;pointer-events:none}
.arrow.nudge{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-8px) scale(1.06)}}
.book{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column;gap:1.4vh;align-items:center}
.stage{position:relative;width:100%;max-width:min(100%,calc((100vh - 26vh) * 1.6));flex:1 1 auto;min-height:0;border-radius:32px;overflow:hidden;box-shadow:0 10px 0 #00000014;background:var(--sky);contain:layout paint}
.bg{position:absolute;inset:0}
.bg.garden{background:linear-gradient(var(--sky) 0 62%,var(--grass) 62% 100%)}
.bg.garden::after{content:"";position:absolute;left:0;right:0;top:58%;height:10%;background:radial-gradient(60% 100% at 20% 100%,var(--grass2) 60%,transparent 61%),radial-gradient(50% 100% at 80% 100%,var(--grass2) 60%,transparent 61%)}
.bg.room{background:linear-gradient(var(--wall) 0 66%,var(--floor) 66% 100%)}
.bg.room::after{content:"";position:absolute;left:0;right:0;top:65%;height:2%;background:#D79C66}
.it{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;cursor:pointer;line-height:1;will-change:transform}
.it .in{display:block;transform-origin:50% 90%}
.it .em{font-size:var(--s);display:block}
.it svg{width:var(--s);height:auto;display:block;overflow:visible}
.bounce .in{animation:bounce .6s ease}
@keyframes bounce{30%{transform:translateY(-18%) scale(1.06,.94)}60%{transform:translateY(0) scale(.96,1.04)}}
.hop .in{animation:hop 1.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-40%)}50%{transform:translateY(-40%)}}
.sway .in{animation:sway 2.6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-5deg)}}
.shake .in{animation:shake .5s ease 2}
@keyframes shake{25%{transform:rotate(8deg)}75%{transform:rotate(-8deg)}}
.look .in{animation:look 2s ease-in-out infinite}
@keyframes look{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.spin .in{animation:spin 6s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{direction:rtl;position:absolute;transform:translate(-50%,-100%);background:var(--paper);border-radius:22px;padding:.15em .6em;font-family:var(--read);font-weight:700;font-size:clamp(22px,4vmin,40px);box-shadow:0 4px 0 #00000014;pointer-events:none;animation:pop .35s ease}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.4);opacity:0}}
.heart{position:absolute;font-size:clamp(22px,4vmin,40px);pointer-events:none;animation:float 1.4s ease-out forwards}
@keyframes float{to{transform:translateY(-120px) scale(1.4);opacity:0}}
.strip{flex:0 0 auto;width:100%;max-width:min(100%,calc((100vh - 26vh) * 1.6));background:var(--paper);border-radius:26px;box-shadow:0 6px 0 #00000012;padding:1.2vh 18px;box-sizing:border-box;min-height:clamp(70px,12vh,120px);display:flex;align-items:center;justify-content:center}
.line{direction:rtl;display:flex;flex-wrap:wrap;justify-content:center;gap:.05em .28em;font-family:var(--read);font-weight:700;font-size:clamp(30px,6vmin,58px);line-height:1.55}
.w{border:none;background:none;padding:0 .14em;border-radius:14px;cursor:pointer;transition:background .15s,transform .15s}
.w.on{background:var(--hl);transform:translateY(-3px)}
.w:active{background:#FFD1E8}
/* cover and end */
.full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;text-align:center;padding:16px}
.full h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(40px,8vmin,84px);line-height:1.1;color:var(--ink);text-wrap:balance}
.full p{margin:0;font-size:clamp(18px,3vmin,26px);color:var(--soft)}
.go{border:none;border-radius:999px;padding:.25em 1.3em;font-family:var(--display);font-weight:800;font-size:clamp(26px,5vmin,44px);color:#fff;background:var(--coral);box-shadow:0 6px 0 #D9483A;cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #D9483A}
.go[disabled]{opacity:.6}
.choices{position:absolute;inset:auto 0 8% 0;display:flex;justify-content:center;gap:4%}
.ch{width:24%;aspect-ratio:1;max-width:220px;border:none;border-radius:28px;background:var(--paper);box-shadow:0 8px 0 #00000016;font-size:clamp(56px,13vmin,120px);cursor:pointer;display:grid;place-items:center;transition:transform .2s}
.ch.right{background:#D7F7E2;transform:scale(1.08)}
.ch.wrong{animation:shake .45s ease}
.stars{font-size:clamp(40px,9vmin,80px);letter-spacing:.1em}

.it .mv{display:block}
.hint::after{content:"";position:absolute;inset:-12%;border-radius:50%;border:5px solid #fff;opacity:.9;animation:ring 1.4s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(1.25);opacity:0}}
.hand{position:absolute;font-size:clamp(34px,7vmin,64px);pointer-events:none;animation:tapme 1s ease-in-out infinite;z-index:5}
@keyframes tapme{50%{transform:translate(-6px,-14px)}}
.line .w{opacity:0;animation:wordin .45s cubic-bezier(.3,1.6,.5,1) forwards}
.line .w.hide{animation:none;opacity:0}
.line .w.show{animation:wordin .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes wordin{from{opacity:0;transform:translateY(20px) scale(.5)}to{opacity:1;transform:none}}
.w.jump{animation:wjump .5s ease!important;opacity:1}
@keyframes wjump{40%{transform:translateY(-14px) scale(1.15)}}
.w.big{color:var(--coral)}
.confetti{position:absolute;width:12px;height:18px;border-radius:3px;top:-5%;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.spark{position:absolute;font-size:clamp(18px,3.4vmin,32px);pointer-events:none;transform:translate(-50%,-50%);animation:spark .75s ease-out forwards}
@keyframes spark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
.bg.farm{background:linear-gradient(#CDEBFF 0 56%,#A8DE8C 56% 100%)}
.bg.farm::after{content:"";position:absolute;left:0;right:0;top:52%;height:6%;background:repeating-linear-gradient(90deg,#C98B4E 0 1.2%,transparent 1.2% 6%),linear-gradient(transparent 30%,#C98B4E 30% 42%,transparent 42% 70%,#C98B4E 70% 82%,transparent 82%)}
.bg.party{background:linear-gradient(#FFE6F2 0 66%,#F3C9A0 66% 100%)}
.bg.party::after{content:"";position:absolute;left:0;right:0;top:0;height:9%;background:repeating-linear-gradient(90deg,#FF6B5B 0 4%,#FFC83D 4% 8%,#7C4DFF 8% 12%,#3CBF6E 12% 16%);clip-path:polygon(0 0,100% 0,100% 40%,98% 100%,96% 40%,94% 100%,92% 40%,90% 100%,88% 40%,86% 100%,84% 40%,82% 100%,80% 40%,78% 100%,76% 40%,74% 100%,72% 40%,70% 100%,68% 40%,66% 100%,64% 40%,62% 100%,60% 40%,58% 100%,56% 40%,54% 100%,52% 40%,50% 100%,48% 40%,46% 100%,44% 40%,42% 100%,40% 40%,38% 100%,36% 40%,34% 100%,32% 40%,30% 100%,28% 40%,26% 100%,24% 40%,22% 100%,20% 40%,18% 100%,16% 40%,14% 100%,12% 40%,10% 100%,8% 40%,6% 100%,4% 40%,2% 100%,0 40%)}
.bg.cloudy{background:linear-gradient(#AFC0D6 0 62%,#7FC08A 62% 100%)}
.bg.shelfbg{background:linear-gradient(160deg,#FFF4D6,#FFE1EC)}
.pond{display:block;width:var(--s);height:calc(var(--s)*.32);border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#9EDCFF,#4FAEE8 70%);box-shadow:inset 0 -6px 0 #3A93CF}
.table{display:block;width:var(--s);height:calc(var(--s)*.18);border-radius:14px 14px 4px 4px;background:#C98B4E;box-shadow:inset 0 8px 0 #E0A66A}
.rainbox{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rainbox i{position:absolute;top:-8%;width:4px;height:5%;border-radius:2px;background:#5AA8E6;opacity:.75;animation:rainfall linear infinite}
@keyframes rainfall{to{transform:translateY(1200%)}}
.shelf{direction:rtl;position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:3.2%;padding:4%;box-sizing:border-box}
.card{position:relative;border:none;border-radius:28px;background:var(--c);box-shadow:0 8px 0 #00000014;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;cursor:pointer;min-height:0;padding:8px}
.card:active{transform:translateY(4px);box-shadow:0 3px 0 #00000014}
.cv{font-size:clamp(48px,11vmin,110px);line-height:1}
.cvs svg{width:clamp(56px,11vmin,110px);height:auto;display:block}
.ct{font-family:var(--read);font-weight:700;font-size:clamp(20px,3.6vmin,34px);color:var(--ink);text-wrap:balance;text-align:center}
.badge{position:absolute;top:10px;left:12px;font-size:clamp(22px,4vmin,36px)}
.lib-t{font-family:var(--display);font-weight:800;font-size:.75em}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.go.alt{background:var(--berry);box-shadow:0 6px 0 var(--berry-d)}
@media (prefers-reduced-motion:reduce){.it .in,.arrow.nudge,.heart{animation:none!important}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="cat" viewBox="0 0 120 130">
  <style>.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}.tail{transform-origin:92px 112px;animation:wag 1.6s ease-in-out infinite}@keyframes wag{50%{transform:rotate(-14deg)}}
.it .mv{display:block}
.hint::after{content:"";position:absolute;inset:-12%;border-radius:50%;border:5px solid #fff;opacity:.9;animation:ring 1.4s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.7);opacity:.9}to{transform:scale(1.25);opacity:0}}
.hand{position:absolute;font-size:clamp(34px,7vmin,64px);pointer-events:none;animation:tapme 1s ease-in-out infinite;z-index:5}
@keyframes tapme{50%{transform:translate(-6px,-14px)}}
.line .w{opacity:0;animation:wordin .45s cubic-bezier(.3,1.6,.5,1) forwards}
.line .w.hide{animation:none;opacity:0}
.line .w.show{animation:wordin .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes wordin{from{opacity:0;transform:translateY(20px) scale(.5)}to{opacity:1;transform:none}}
.w.jump{animation:wjump .5s ease!important;opacity:1}
@keyframes wjump{40%{transform:translateY(-14px) scale(1.15)}}
.w.big{color:var(--coral)}
.confetti{position:absolute;width:12px;height:18px;border-radius:3px;top:-5%;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

  <g class="eye"><ellipse cx="44" cy="44" rx="7" ry="9" fill="#22314A"/><circle cx="46.5" cy="40.5" r="2.6" fill="#fff"/></g><g class="eye"><ellipse cx="76" cy="44" rx="7" ry="9" fill="#22314A"/><circle cx="78.5" cy="40.5" r="2.6" fill="#fff"/></g>
  <circle cx="32" cy="58" r="6" fill="#FF8FA3" opacity=".55"/><circle cx="88" cy="58" r="6" fill="#FF8FA3" opacity=".55"/>

<div id="app">
  <div class="top">
    <button class="rb" id="home" aria-label="الغلاف">🏠</button>
    <div class="dots" id="dots"></div>
    <div style="display:flex;gap:10px"><button class="rb" id="mute" aria-label="الصوت">🔊</button><button class="rb" id="again" aria-label="أعيدي الصفحة">↻</button></div>
  </div>
  <div class="main">
    <button class="arrow" id="prev" aria-label="الصفحة السابقة">▶</button>

      <div class="stage" id="stage"></div>

<script>
// Lulu's story library: Arabic text, no speech. Each page animates in and has one thing to tap.
const CAT='<svg viewBox="0 0 120 130"><use href="#cat"/></svg>';
const BALL='<svg viewBox="0 0 100 100"><use href="#ball"/></svg>';
const POND='<span class="pond"></span>';
const T=(f,ms)=>later(f,ms);

const STORIES=[
{key:'ball', title:'لُولُو وَالْكُرَةُ الْحَمْرَاءُ', cover:BALL, color:'#FFD9D4',
 pages:[
 {bg:'garden', text:'هَذِهِ لُولُو. لُولُو قِطَّةٌ صَغِيرَةٌ.', target:'lulu', items:[
   {id:'sun',h:'☀️',x:86,y:16,s:10,idle:'spin',enter:'drop'},
   {id:'f1',h:'🌼',x:16,y:82,s:7,enter:'pop',d:300},{id:'f2',h:'🌷',x:82,y:86,s:7,enter:'pop',d:450},
   {id:'lulu',h:CAT,x:50,y:62,s:30,idle:'sway',enter:'left',d:200}],
  act(){ bubbleAt('lulu','مِيَاو!','meow'); hearts('lulu',6); jump('lulu'); }},
 {bg:'garden', text:'عِنْدَ لُولُو كُرَةٌ حَمْرَاءُ.', target:'ball', items:[
   {id:'sun',h:'☀️',x:86,y:16,s:10,idle:'spin'},
   {id:'lulu',h:CAT,x:30,y:62,s:26,idle:'sway',enter:'pop'},
   {id:'ball',h:BALL,x:66,y:72,s:12,enter:'drop',d:400}],
  act(){ arc('ball',30,52,3); T(()=>jump('lulu'),500); T(()=>jump('lulu'),1500); }},
 {bg:'garden', text:'أَوَّهْ! أَيْنَ الْكُرَةُ؟', target:'lulu', items:[
   {id:'cloud',h:'☁️',x:20,y:18,s:12,idle:'sway'},
   {id:'lulu',h:CAT,x:50,y:62,s:28,idle:'look'},
   {id:'ball',h:BALL,x:56,y:74,s:10}],
  enter(){ T(()=>move('ball',120,74,1200,'spinroll'),300); },
  act(){ [0,1,2].forEach(k=>T(()=>floatAt('lulu','❓',(k-1)*14),k*250)); bubbleAt('lulu','أَيْنَ؟'); }},
 {bg:'room', text:'هَلْ هِيَ تَحْتَ السَّرِيرِ؟ لَا!', hideLast:1, target:'bed', items:[
   {id:'pic',h:'🖼️',x:76,y:24,s:10,enter:'drop'},
   {id:'bed',h:'🛏️',x:58,y:64,s:32,enter:'pop'},
   {id:'lulu',h:CAT,x:20,y:70,s:20,enter:'left',d:200}],
  act(){ move('lulu',52,80,700); T(()=>{shake('bed'); floatAt('bed','🧦',-10);},700);
         T(()=>{move('lulu',22,70,700); T(()=>{bubbleAt('lulu','لَا!'); reveal();},750);},1700); }},
 {bg:'room', text:'هَلْ هِيَ عَلَى الْكَنَبَةِ؟ لَا!', hideLast:1, target:'sofa', items:[
   {id:'win',h:'🪟',x:24,y:24,s:12,enter:'drop'},
   {id:'sofa',h:'🛋️',x:60,y:62,s:34,enter:'pop'},
   {id:'lulu',h:CAT,x:18,y:70,s:20,enter:'left',d:200}],
  act(){ arc('lulu',58,46,1); T(()=>{jump('sofa'); floatAt('sofa','🧸',12); floatAt('sofa','📕',-14);},700);
         T(()=>{arc('lulu',18,70,1); T(()=>{bubbleAt('lulu','لَا!'); reveal();},950);},1800); }},
 {bg:'garden', text:'انْظُرِي! الْكَلْبُ مَعَهُ الْكُرَةُ!', target:'dog', items:[
   {id:'sun',h:'☀️',x:86,y:16,s:10,idle:'spin'},
   {id:'lulu',h:CAT,x:24,y:66,s:20,enter:'pop'},
   {id:'dog',h:'🐶',x:62,y:60,s:26,idle:'sway',enter:'right',d:400},
   {id:'ball',h:BALL,x:76,y:78,s:10,enter:'right',d:400}],
  act(){ bubbleAt('dog','هَوْ هَوْ!','woof'); jump('dog'); T(()=>jump('lulu'),300); }},
 {bg:'garden', text:'تَلْعَبُ لُولُو مَعَ الْكَلْبِ. شُكْرًا يَا كَلْبُ!', target:'ball', items:[
   {id:'sun',h:'☀️',x:86,y:16,s:10,idle:'spin'},
   {id:'lulu',h:CAT,x:26,y:64,s:22,idle:'sway'},
   {id:'dog',h:'🐶',x:72,y:62,s:24,idle:'sway'},
   {id:'ball',h:BALL,x:50,y:76,s:9,enter:'drop',d:300}],

  else o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

let NOISE=null;

const $=id=>document.getElementById(id);
const stage=$('stage'), line=$('line');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let S=null, PAGES=[], page=-1, done=false, handT=0, timers=[];
function later(f,ms){ const t=setTimeout(f,ms); timers.push(t); return t; }
function clearAll(){ timers.forEach(clearTimeout); timers=[]; clearTimeout(handT); }
function total(){ return PAGES.length+1; }

function el(id){ return stage.querySelector('[data-id="'+id+'"]'); }
function pos(id){ const e=el(id); return e?[parseFloat(e.style.left),parseFloat(e.style.top)]:[50,50]; }
function W(){ return stage.clientWidth; } function H(){ return stage.clientHeight; }
function move(id,x,y,ms=800,extra){
  const e=el(id); if(!e) return; const [x0,y0]=pos(id); const mv=e.querySelector('.mv');
  const dx=(x-x0)/100*W(), dy=(y-y0)/100*H();
  SFX.whoosh();

  a.onfinish=()=>{ e.style.left=x+'%'; e.style.top=y+'%'; a.cancel(); };
}
function arc(id,x,y,n=1,ms=900){
  const e=el(id); if(!e) return; const [x0,y0]=pos(id); const mv=e.querySelector('.mv');
  const dx=(x-x0)/100*W(), dy=(y-y0)/100*H(), up=-0.28*H();
  const kf=[{transform:'translate(0,0)'},{transform:`translate(${dx/2}px,${dy/2+up}px)`,easing:'ease-in'},{transform:`translate(${dx}px,${dy}px)`}];
  if(n>1) kf.push({transform:`translate(${dx/2}px,${dy/2+up*.6}px)`},{transform:'translate(0,0)'});
  SFX.whoosh(); SFX.boing(ms/1000*.95); if(n>1) SFX.boing(ms/1000*1.95);
  const a=mv.animate(kf,{duration:RM?1:ms*(n>1?2:1),easing:'ease-out',fill:'forwards'});

function jump(id){ const e=el(id); if(!e) return; SFX.boing(); e.querySelector('.in').animate([{transform:'none'},{transform:'translateY(-22%) scale(1.05,.95)'},{transform:'none'}],{duration:500,easing:'ease-out'}); }

  const d=document.createElement('div'); d.className='bubble'; d.textContent=t; d.style.left=x+'%'; d.style.top=`max(14%, calc(${y}% - ${s*0.55}vmin))`; stage.appendChild(d); setTimeout(()=>d.remove(),1600); }
function floatAt(id,ch,off=0){ const [x,y]=pos(id); const h=document.createElement('div'); h.className='heart'; h.textContent=ch; h.style.left=(x+off)+'%'; h.style.top=(y-12)+'%'; stage.appendChild(h); setTimeout(()=>h.remove(),1500); }
function burst(id){ const [x,y]=pos(id); for(let k=0;k<8;k++){ const sp=document.createElement('div'); sp.className='spark'; sp.textContent=k%2?'✨':'⭐'; sp.style.left=x+'%'; sp.style.top=y+'%'; const a=k/8*Math.PI*2, r=14; sp.style.setProperty('--dx',Math.cos(a)*r+'vmin'); sp.style.setProperty('--dy',Math.sin(a)*r+'vmin'); stage.appendChild(sp); setTimeout(()=>sp.remove(),800);} }
function hearts(id,n=5,ch='💜'){ for(let k=0;k<n;k++) later(()=>floatAt(id,ch,Math.random()*16-8),k*110); }
function confetti(n=40){ const C=['#FF6B5B','#FFC83D','#7C4DFF','#3CBF6E','#4FC3E8'];
  SFX.win(); for(let k=0;k<n;k++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'%'; c.style.background=C[k%5]; c.style.animationDuration=(1.6+Math.random()*1.4)+'s'; c.style.animationDelay=(Math.random()*.5)+'s'; stage.appendChild(c); setTimeout(()=>c.remove(),3600); } }
function rain(on){ if(!on||RM) return; const box=document.createElement('div'); box.className='rainbox'; for(let k=0;k<26;k++){ const d=document.createElement('i'); d.style.left=(Math.random()*100)+'%'; d.style.animationDelay=(-Math.random()*1)+'s'; d.style.animationDuration=(.7+Math.random()*.4)+'s'; box.appendChild(d); } stage.insertBefore(box,stage.children[1]||null); }

function enterAnim(e,how,d){
  if(!how||RM) return; const mv=e.querySelector('.mv'); const w=(d||0)/1000;
  if(how==='pop') SFX.pop(w); else if(how==='drop'){ SFX.whoosh(w); SFX.thud(w+.55); } else SFX.whoosh(w);
  const k={left:[{transform:`translateX(${-0.7*W()}px)`},{transform:'none'}],
           right:[{transform:`translateX(${0.7*W()}px)`},{transform:'none'}],
           pop:[{transform:'scale(0)'},{transform:'scale(1.15)'},{transform:'none'}],
           drop:[{transform:`translateY(${-0.8*H()}px)`},{transform:'translateY(4%)'},{transform:'none'}]}[how];
  mv.animate(k,{duration:how==='pop'?500:900,delay:d||0,easing:'cubic-bezier(.3,1.2,.5,1)',fill:'backwards'});
}
function showHint(id){
  clearTimeout(handT);
  handT=setTimeout(()=>{ if(done) return; const e=el(id); if(!e) return; e.classList.add('hint');
    const [x,y]=pos(id); const h=document.createElement('div'); h.className='hand'; h.id='hand'; h.textContent='👆'; h.style.left=`calc(${x}% + 2vmin)`; h.style.top=`min(84%, calc(${y}% + 6vmin))`; stage.appendChild(h); },2000);
}
function hideHint(){ clearTimeout(handT); const h=$('hand'); if(h) h.remove(); stage.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint')); }

function setText(text,hideLast=0){
  const words=text.split(' '); line.innerHTML='';
  words.forEach((w,j)=>{ const b=document.createElement('button'); b.className='w'; b.textContent=w; b.style.animationDelay=(600+j*220)+'ms';
    if(j>=words.length-hideLast) b.classList.add('hide');
    b.onclick=()=>{ SFX.tick(j); b.classList.remove('jump'); void b.offsetWidth; b.classList.add('jump'); };
    line.appendChild(b); });
}
function reveal(){ SFX.sparkle(); line.querySelectorAll('.w.hide').forEach(b=>{ b.classList.remove('hide'); b.style.animationDelay='0ms'; b.classList.add('show','big'); }); }

function makeItem(it){
  const P=PAGES[page];
  const b=document.createElement('button'); b.className='it '+(it.idle||''); b.dataset.id=it.id;
  b.style.left=it.x+'%'; b.style.top=it.y+'%'; b.style.setProperty('--s',it.s+'vmin'); b.setAttribute('aria-label',it.id);
  b.innerHTML='<span class="mv"><span class="in">'+(it.h.startsWith('<')?it.h:'<span class="em">'+it.h+'</span>')+'</span></span>';
  b.onclick=()=>{
    if(it.id===P.target && !done){ done=true; hideHint(); burst(it.id); P.act(); later(()=>$('next').classList.add('nudge'),2400); }
    else if(it.id===P.target){ P.act(); }
    else jump(it.id);
  };
  stage.appendChild(b); return b;
}
function render(i){
  const P=PAGES[i]; stage.innerHTML='<div class="bg '+P.bg+'"></div>';
  rain(P.rain);
  P.items.forEach(it=>{ if(it.hidden) return; const b=makeItem(it); enterAnim(b,it.enter,it.d); });
  setText(P.text,P.hideLast||0);
  if(P.enter) P.enter();
  showHint(P.target);
}
function quiz(){
  const Q=S.quiz; stage.innerHTML='<div class="bg garden"></div>';
  const top=document.createElement('div'); top.className='it hop'; top.style.left='50%'; top.style.top='26%'; top.style.setProperty('--s','14vmin');
  top.innerHTML='<span class="mv"><span class="in">'+(Q.top.startsWith('<')?Q.top:'<span class="em">'+Q.top+'</span>')+'</span></span>'; stage.appendChild(top);
  const c=document.createElement('div'); c.className='choices'; let solved=false;
  Q.opts.forEach(([e,k,ok],j)=>{
    const b=document.createElement('button'); b.className='ch'; b.textContent=e; b.setAttribute('aria-label',k);
    b.animate([{transform:'scale(0)'},{transform:'scale(1.1)'},{transform:'none'}],{duration:500,delay:300+j*150,fill:'backwards',easing:'ease-out'});
    SFX.pop(.3+j*.15);
    b.onclick=()=>{
      if(solved) return;
      if(ok){ solved=true; b.classList.add('right'); if(Q.sfx) SFX[Q.sfx](); confetti(); setText(Q.yes); later(end,2800); }
      else { SFX.wrong(); b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); }
    };
    c.appendChild(b); });
  stage.appendChild(c);
  setText(Q.q);
}
function getStars(){ try{ return JSON.parse(localStorage.getItem('orchid-stars')||'{}'); }catch(e){ return {}; } }
function addStar(k){ const s=getStars(); s[k]=(s[k]||0)+1; try{ localStorage.setItem('orchid-stars',JSON.stringify(s)); }catch(e){} }
function end(){
  clearAll(); addStar(S.key); page=total(); updateNav();
  stage.innerHTML='<div class="bg garden"></div><div class="full"><div class="stars">⭐⭐⭐</div><h1>النِّهَايَةُ!</h1><div class="it hop" style="position:relative;left:auto;top:auto;transform:none;--s:18vmin"><span class="mv"><span class="in">'+CAT+'</span></span></div><div class="row"><button class="go" id="re">اقْرَئِي مَرَّةً ثَانِيَةً</button><button class="go alt" id="lib">قِصَّةٌ أُخْرَى 📚</button></div></div>';
  setText('أَحْسَنْتِ يَا أُورْكِيد!');
  confetti(50);
  $('re').onclick=()=>go(0); $('lib').onclick=library;
}
function library(){
  clearAll(); S=null; PAGES=[]; page=-1; updateNav(); $('dots').innerHTML='';
  const st=getStars();
  stage.innerHTML='<div class="bg shelfbg"></div><div class="shelf">'+STORIES.map((s,i)=>
    '<button class="card" data-i="'+i+'" style="--c:'+s.color+'"><span class="cv">'+(s.cover.startsWith('<')?'<span class="cvs">'+s.cover+'</span>':s.cover)+'</span><span class="ct">'+s.title+'</span>'+(st[s.key]?'<span class="badge">⭐</span>':'')+'</button>').join('')+'</div>';
  stage.querySelectorAll('.card').forEach((c,j)=>{ c.animate([{transform:'scale(0)'},{transform:'scale(1.06)'},{transform:'none'}],{duration:450,delay:j*120,fill:'backwards',easing:'ease-out'});
    c.onclick=()=>{ ac(); SFX.sparkle(); openStory(+c.dataset.i); }; });
  line.innerHTML='<span class="lib-t">مَكْتَبَةُ لُولُو 📚</span>';
}
function openStory(i){ S=STORIES[i]; PAGES=S.pages; $('dots').innerHTML=Array.from({length:total()},()=>'<i></i>').join(''); page=-1; go(0); }
function updateNav(){
  const inStory=S&&page>=0&&page<total();
  $('prev').disabled=!inStory||page<=0;
  $('next').disabled=!inStory||page>=total()-1;
  $('next').classList.remove('nudge');
  $('again').disabled=!inStory;
  [...$('dots').children].forEach((d,j)=>d.classList.toggle('on',j===page));
}
function go(i){
  if(!S) return; clearAll(); if(i<0) return; if(i>=total()) return end();
  if(page>=0) SFX.page(); page=i; done=false; updateNav(); hideHint();
  if(i===PAGES.length) quiz(); else render(i);
}
$('next').onclick=()=>go(page+1);
$('prev').onclick=()=>go(page-1);
$('again').onclick=()=>{ if(S&&page>=0&&page<total()) go(page); };
$('home').onclick=library;
function setMute(m){ muted=m; $('mute').textContent=m?'🔇':'🔊'; try{localStorage.setItem('orchid-mute',m?'1':'0');}catch(e){} }
setMute(muted); $('mute').onclick=()=>{ setMute(!muted); if(!muted) SFX.pop(); };
let sx=null; stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{ if(sx==null||!S||page<0||page>=total()) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>70) go(page+(dx>0?1:-1)); },{passive:true});
library();
</script>

</body>
