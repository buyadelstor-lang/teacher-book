/* Layout: same "crayon box" world as دفتر المعلم (cream page, ink outlines, crayon colours, same fonts) pushed to 8-bit: square corners, hard pixel shadows, graph-paper grid, pixel digits. Top bar = control, goal band, stage beside scoreboard. */
:root{
  --bg:#FFF8EC; --surface:#FFFFFF; --sunk:#FFF0D9; --ink:#2A2140; --muted:#6B5F80; --line:#EADFCB; --edge:#2A2140; --grid:rgba(42,33,64,.07);
  --accent:#F5B935; --accent-ink:#4A3200;
  --ok:#2E9E5B; --bad:#E5484D; --warn:#C27C00;
  --k-coral:#FF7A59; --k-blue:#4C8DF6; --k-teal:#2FB0A2; --k-pink:#EF5DA8; --k-purple:#8A6CE0; --k-sun:#F5B935; --k-green:#5DBB4F;
  --display:"Baloo Bhaijaan 2","Readex Pro",Tahoma,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;
  --pixel:"Press Start 2P","Courier New",monospace;
  --px:4px;
  direction:rtl;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1630; --surface:#252040; --sunk:#2E2850; --ink:#F5F0FF; --muted:#B4A9CF; --line:#3A3360; --edge:#6E62A3; --grid:rgba(245,240,255,.05);
  --accent:#FFC94D; --accent-ink:#3A2700; --ok:#55C97F; --bad:#FF6B6F; --warn:#FFBE3D;
  --k-coral:#FF8A6B; --k-blue:#6A9FFF; --k-teal:#3CC4B5; --k-pink:#FF74B8; --k-purple:#A08AF0; --k-sun:#FFC94D; --k-green:#72CC64; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1630; --surface:#252040; --sunk:#2E2850; --ink:#F5F0FF; --muted:#B4A9CF; --line:#3A3360; --edge:#6E62A3; --grid:rgba(245,240,255,.05);
  --accent:#FFC94D; --accent-ink:#3A2700; --ok:#55C97F; --bad:#FF6B6F; --warn:#FFBE3D;
  --k-coral:#FF8A6B; --k-blue:#6A9FFF; --k-teal:#3CC4B5; --k-pink:#FF74B8; --k-purple:#A08AF0; --k-sun:#FFC94D; --k-green:#72CC64; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%;image-rendering:pixelated}

#app{position:relative;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:16px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
/* pixel box: square corners, thick ink outline, hard offset shadow */
.box8{background:var(--surface);border:3px solid var(--edge);border-radius:0;box-shadow:6px 6px 0 var(--edge)}

button{font:inherit;font-family:var(--display);font-weight:700;color:var(--ink);cursor:pointer;border:3px solid var(--edge);background:var(--surface);border-radius:0;
  padding:7px 15px;box-shadow:4px 4px 0 var(--edge);transition:transform .06s steps(2),box-shadow .06s steps(2)}
@media (hover:hover){button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--edge)}}
button,select,.pw-tile,.pw-slot,.pk-z,canvas{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.stage button,.tabs button,.goal button,.board button,.pk,.pw{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--edge)}
button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:2px 2px 0 var(--edge)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px dashed var(--k-blue);outline-offset:3px}
.primary{background:var(--k-blue);color:#fff}
.good{background:var(--k-green);color:#13260F}
.bad{background:var(--k-coral);color:#2A0E05}
.ghost{background:var(--sunk)}
.num{font-variant-numeric:tabular-nums}
.p8{font-family:var(--pixel);letter-spacing:0}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;line-height:1.25}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:12px 14px}
.brand{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;margin-inline-end:auto;display:flex;flex-direction:column}
.brand::after{content:"";display:block;height:8px;margin-top:4px;width:100%;
  background:linear-gradient(90deg,var(--k-coral) 0 16.6%,var(--k-sun) 0 33.3%,var(--k-teal) 0 50%,var(--k-blue) 0 66.6%,var(--k-purple) 0 83.3%,var(--k-pink) 0)}
.modes{display:flex;gap:6px}
.modes button{background:var(--sunk);padding:6px 13px}
.modes button[aria-pressed="true"]{background:var(--k-sun);color:var(--accent-ink)}
.timer{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);padding:4px 6px 4px 10px}
.timer .t{font-family:var(--pixel);font-size:1.15rem;min-width:5.6ch;text-align:center;line-height:1;color:var(--k-green);direction:ltr}
.timer.low .t{color:var(--k-coral);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.timer select{font:inherit;font-family:var(--display);border:0;background:transparent;color:var(--bg)}
.timer select option{background:var(--surface);color:var(--ink)}
.timer button{padding:3px 10px;box-shadow:2px 2px 0 var(--bg);border-color:var(--bg)}
.freeze-btn{background:var(--k-coral);color:#2A0E05}

.goal{padding:14px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 18px;align-items:center}
.goal .lbl{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.2}
.goal .lbl small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.85rem}
.track{height:30px;background:var(--sunk);border:3px solid var(--edge);position:relative;overflow:hidden}
.fill{height:100%;width:0;transition:width .5s steps(8);
  background:repeating-linear-gradient(90deg,var(--k-sun) 0 12px,color-mix(in srgb,var(--k-sun) 70%,#fff) 12px 16px)}
.track span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pixel);font-size:.75rem;direction:ltr;color:var(--ink)}
.goal .ctl{display:flex;gap:10px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;flex:1}
.panel{padding:18px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lessonbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px;padding:10px 12px;background:var(--k-teal);color:#08201D;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge)}
.lessonbar label{font-family:var(--display);font-weight:800;font-size:1.1rem}
.lessonbar select{font:inherit;font-weight:700;flex:1;min-width:0;max-width:100%;background:var(--surface);color:var(--ink);border:3px solid var(--edge);border-radius:0;padding:6px 8px}
.lessonbar small{width:100%;font-size:.85rem}
.tabs button{background:var(--sunk)}
.tabs button:nth-child(1)[aria-selected="true"]{background:var(--k-pink);color:#fff}
.tabs button:nth-child(2)[aria-selected="true"]{background:var(--k-teal);color:#08201D}
.tabs button:nth-child(3)[aria-selected="true"]{background:var(--k-purple);color:#fff}
.tabs button:nth-child(4)[aria-selected="true"]{background:var(--k-blue);color:#fff}
.tabs button:nth-child(5)[aria-selected="true"]{background:var(--k-coral);color:#2A0E05}
.tabs button:nth-child(6)[aria-selected="true"]{background:var(--k-green);color:#13260F}
.tabs button:nth-child(7)[aria-selected="true"]{background:var(--k-sun);color:#3A2600}
.tabs button:nth-child(8)[aria-selected="true"]{background:var(--k-purple);color:#fff}
#bigq[aria-pressed="true"]{background:var(--k-sun);color:#3A2600}
/* board mode: only the stage, big type for the back row */
body.bigq .main{grid-template-columns:1fr}
body.bigq #board,body.bigq .lessonbar,body.bigq .tabs{display:none}
body.bigq .qtext{font-size:clamp(2.2rem,5vw,4.2rem)}
body.bigq .opt{font-size:clamp(1.3rem,2.6vw,2.1rem);min-height:90px}
body.bigq .opt .l{width:2.2em;height:2.2em}
body.bigq .qcard{max-width:1200px}
body.bigq .tfbtn{font-size:2.6rem;padding:18px 48px}
body.bigq .ans{font-size:clamp(2.4rem,5vw,4rem)}
body.bigq .ring b{font-size:3.6rem}
body.bigq .wheel-wrap{width:min(100%,520px)}
.boss .lvl{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-family:var(--pixel);font-size:.55rem;background:var(--k-sun);color:#3A2600;border:2px solid var(--edge);padding:1px 4px;white-space:nowrap;direction:ltr}
/* cup: world-cup style bracket */
.cup{width:100%;display:flex;flex-direction:column;gap:16px;align-items:center}
.brk{width:100%;display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:center}
.brk .col{display:flex;flex-direction:column;gap:14px}
.brk .col h4{margin:0;font-family:var(--pixel);font-size:.6rem;text-align:center;color:var(--muted)}
.match{border:3px solid var(--edge);background:var(--surface);box-shadow:4px 4px 0 var(--edge)}

body.fsmode{overflow:hidden}
body.fsmode #app{max-width:none;height:100vh;height:100dvh;min-height:0;box-sizing:border-box;gap:10px;padding:10px 14px}
body.fsmode .bar{padding:6px 10px;gap:6px 10px;box-shadow:4px 4px 0 var(--edge)}
body.fsmode .bar button{padding:5px 12px}
body.fsmode .brand{font-size:1.35rem}
body.fsmode .brand::after{height:5px}
body.fsmode .goal{padding:6px 14px;box-shadow:4px 4px 0 var(--edge)}
body.fsmode .goal .lbl{font-size:1.1rem}
body.fsmode .goal .lbl small{display:none}
body.fsmode .main{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 330px;gap:12px}
body.fsmode #lesson-info{display:none}
body.fsmode.bigq .main{grid-template-columns:1fr}
body.fsmode .panel{padding:12px 14px;overflow:auto;min-height:0}
body.fsmode .lessonbar{margin-bottom:8px;padding:6px 10px}
body.fsmode .tabs{margin-bottom:8px;gap:6px}
body.fsmode .tabs button{padding:5px 12px}
body.fsmode .turn{margin-bottom:8px}
body.fsmode .pk{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,32%);grid-template-areas:"pitch board" "pitch q";grid-template-rows:auto 1fr;gap:12px;align-items:start}
body.fsmode .pk-pitch{grid-area:pitch;justify-self:center;max-width:none;width:min(100%,max(520px,calc((100dvh - 480px)*16/11)))}
body.fsmode .pk-board{grid-area:board;grid-template-columns:1fr;max-width:none;gap:8px}
body.fsmode .pk .qcard{grid-area:q;padding:14px;max-width:none;width:auto;margin:0}
body.fsmode .pk .qtext{font-size:clamp(1.3rem,2.2vw,2rem)}
body.fsmode .pk-z{font-size:clamp(.85rem,1.15vw,1.25rem)}
@media (max-width:1000px){body.fsmode .pk{grid-template-columns:1fr;grid-template-areas:"board" "pitch" "q"}}
@media (max-width:900px){body.fsmode .main{grid-template-columns:1fr}}
.pw .pw-box{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:14px;background:var(--ink);border:3px solid var(--edge);box-shadow:5px 5px 0 var(--edge);margin-top:6px}
.pw-lock{font-size:1.8rem}
.pw-slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pw-slots.bad{animation:pwshake .4s steps(4)}
@keyframes pwshake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pw-slot{width:clamp(44px,5vw,64px);height:clamp(52px,6vw,76px);padding:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3vw,2.4rem);background:var(--sunk);border:3px solid var(--bg);box-shadow:3px 3px 0 rgba(0,0,0,.4);color:var(--ink)}
.pw-slot.full{background:var(--k-sun);color:#2A2140}
.pw-slots.ok .pw-slot{background:var(--k-green);color:#13260F}
.pw-slots.bad .pw-slot{background:var(--k-coral)}
.pw-slot.shown{background:#FFB3AB;color:#2A2140}
.pw-gap{width:22px}
.pw-prev{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.6rem);letter-spacing:.06em;min-height:1.4em;color:var(--ink);text-align:center;margin-top:10px}
.pw-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.pw-tile{width:clamp(50px,5.4vw,70px);height:clamp(50px,5.4vw,70px);padding:0;font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3vw,2.4rem);background:var(--surface);display:grid;place-items:center}
.pw-tile:nth-child(3n+1){background:#FFE7D6}.pw-tile:nth-child(3n+2){background:#DCE9FF}.pw-tile:nth-child(3n){background:#E3F6DA}
.pw-tile:disabled{opacity:.18}
body.bigq .pw-slot,body.bigq .pw-tile{width:84px;height:92px;font-size:3rem}
.pw-tbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pw-timer{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--k-green);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);padding:4px 8px}
.pw-timer[hidden]{display:none}
.pw-timer b{font-family:var(--pixel);font-weight:400;font-size:1.8rem;min-width:3ch;text-align:center;direction:ltr}
.pw-timer.low b{color:var(--k-coral);animation:blink .5s steps(2) infinite}
.pw-clock{font-size:1.3rem}
.pw-adj{padding:2px 8px;font-family:var(--pixel);font-size:.75rem;box-shadow:2px 2px 0 var(--bg);border-color:var(--bg);direction:ltr}
.pw-tog{padding:4px 12px;font-size:.95rem}

function note(f,st,d,type,g,f2){const c=ac();if(!c)return;const t=c.currentTime+.01+st,o=c.createOscillator(),v=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g||.1,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+d+.03)}

/* teams & turns */
function splitTeams(){
  const n=Math.max(2,Math.min(6,S.teamCount|0));const old=S.teams||[];
  const sh=shuffle(S.students);
  S.teams=Array.from({length:n},(_,i)=>({name:(old[i]&&old[i].name)||TEAM_NAMES[i],color:TEAM_COLORS[i],score:(old[i]&&old[i].score)||0,members:[]}));
  sh.forEach((s,i)=>S.teams[i%n].members.push(s));
  S.turn=0;
}
function teamOf(name){const t=S.teams.find(t=>t.members.includes(name));return t?t.name:''}
function nextStudent(){if(!S.students.length)return null;if(!S.bag||!S.bag.length)S.bag=shuffle(S.students);S.cur=S.bag.pop();return S.cur}
function advance(){
  if(S.mode==='groups')S.turn=(S.turn+1)%S.teams.length;
  else if(S.mode==='individual')nextStudent();
  save();renderTurn();renderBoard();
}
function addGoal(d){
  const before=S.goal.pts;S.goal.pts=Math.max(0,S.goal.pts+d);save();renderGoal();
  const T=S.goal.target,hpB=T-before,hpA=T-S.goal.pts;
  if(d>0&&hpB>0)bossHit();
  if(d<0){bossLaugh();bossSay([pickLine(LAUGH)])}
  if(hpB>T/2&&hpA<=T/2&&hpA>0)bossSay(['آخ! خسرت نصف طاقتي...','لا يمكن! كيف صرتم أقوياء هكذا؟']);
  else if(hpB>3&&hpA<=3&&hpA>0)bossSay(['لا... لا... طاقتي تكاد تنفد!']);
  if(before<T&&S.goal.pts>=T){bossSay(['مستحيل! عقولكم هزمت عضلاتي...','سأعود... في الحصة القادمة!']);S.bossPending=true;save();setTimeout(()=>{sfx.fanfare();confetti(320);showEnd('هزمتم '+BN()+'!','المكافأة: '+S.goal.reward+'. انتبهوا... سيعود في المستوى '+((S.bossLv||0)+2)+' بشكل جديد!',false)},2600)}
}
function award(ok){
  const gold=ok&&S.golden;if(gold){S.golden=false;toast('سؤال ذهبي! النقاط مضاعفة')}
  if(ok){if(gold){if(S.mode==='groups')S.teams[S.turn].score++;else if(S.mode==='individual'&&S.cur)S.sScore[S.cur]=(S.sScore[S.cur]||0)+1;addGoal(1)}
    if(S.mode==='groups'){S.teams[S.turn].score++;popKey='t'+S.turn}
    else if(S.mode==='individual'&&S.cur){S.sScore[S.cur]=(S.sScore[S.cur]||0)+1;popKey='s'+S.cur}
    sfx.correct();confetti(140);flash('stagebox','flash-good');addGoal(1);toast(S.mode==='class'?'+1 للفصل':'+1 نقطة، و+1 لهدف الفصل');
  }else{sfx.wrong();flash('stagebox','shake');flash('stagebox','flash-bad')}
  advance();
}

  if(!av.length){const set=new Set(pool.map(x=>x[0]));S.usedQ=S.usedQ.filter(x=>!set.has(x));av=pool.map((_,i)=>i);toast('انتهت أسئلة هذا الدرس، نبدأ دورة جديدة')}return av}

/* 4 choices: correct + 3 distractors (same letter first when the question has one, then same pool, then the whole bank) */
function choices(pool,a,h){const uniq=arr=>[...new Set(arr)].filter(x=>x&&x!==a);
  let pick=[];if(h)pick=shuffle(uniq(pool.filter(x=>x[2]===h).map(x=>x[1]))).slice(0,3);
  if(pick.length<3)pick=pick.concat(shuffle(uniq(pool.map(x=>x[1])).filter(x=>!pick.includes(x))).slice(0,3-pick.length));
  if(pick.length<3)pick=pick.concat(shuffle(uniq(BANK.flatMap(x=>x.q.map(y=>y[1]))).filter(x=>!pick.includes(x))).slice(0,3-pick.length));
  return shuffle([a,...pick])}

    b.onclick=()=>{if(grid.dataset.done)return;const ok=o===a;if(!ok){grid.dataset.done='1';[...grid.children].forEach(x=>{x.disabled=true;if(!quiet&&x.lastChild.textContent===a)x.classList.add('right')});b.classList.add('wrong')}onPick(ok,b,grid)};grid.append(b)});

  const expBtn=el('button',{type:'button',class:'ghost',style:'align-self:flex-start;margin-top:6px',onclick:exportPoints},'تصدير نقاط الطلاب لدفتر المعلم (Excel)');
  const qa=el('textarea');qa.value=S.qa.map(x=>x[0]+' | '+x[1]).join('\n');
  const tf=el('textarea');tf.value=S.tf.map(x=>x[0]+' | '+(x[1]?'صح':'خطأ')).join('\n');
  const tc=el('input',{type:'number',min:'2',max:'6'});tc.value=S.teamCount;
  const gt=el('input',{type:'number',min:'5',max:'200'});gt.value=S.goal.target;
  const gr=el('input',{type:'text'});gr.value=S.goal.reward;
  const qs=el('input',{type:'number',min:'5',max:'120'});qs.value=S.qSec;
  const ts=el('input',{type:'number',min:'5',max:'300'});ts.value=S.tfSec;
  const cs=el('input',{type:'number',min:'10',max:'300'});cs.value=S.chSec;
  const bn=el('input',{type:'text',maxlength:'30'});bn.value=S.bossName;
  const sw=el('textarea');
  const lv=el('input',{type:'number',min:'1',max:'99'});lv.value=(S.bossLv||0)+1;
  const hc=el('input',{type:'number',min:'0'});hc.value=Math.max(0,S.goal.target-S.goal.pts);
  let armed=false;const rs=el('button',{class:'bad'},'تصفير النقاط والأسئلة');
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent='اضغط مرة أخرى للتأكيد';return}S.teams.forEach(t=>t.score=0);S.sScore={};S.goal.pts=0;S.usedQ=[];S.usedT=[];S.quickQ=null;save();renderAll();o.hidden=true;toast('صُفّرت النقاط والأسئلة المستعملة')};
  const hid=new Set(S.hiddenGames||[]);
  const gameChecks=GAMES.map(g=>{const c=el('input',{type:'checkbox'});c.checked=!hid.has(g.id);c.dataset.id=g.id;return c});
  const gameList=el('div',{class:'gchecks'},...GAMES.map((g,i)=>el('label',{class:'gcheck'},gameChecks[i],el('span',{},g.name))));
  const grid=(...k)=>el('div',{class:'spane-grid'},...k);
  const panes=[
    ['الطلاب والفرق',grid(el('div',{style:'display:flex;flex-direction:column'},f('s-stu','أسماء الطلاب','اسم في كل سطر، أو استوردها من ملف النسخة الاحتياطية لدفتر المعلم',stu),impBtn,fileIn,expBtn),
      el('div',{style:'display:flex;flex-direction:column;gap:14px'},f('s-tc','عدد الفرق','من 2 إلى 6، يُعاد التوزيع عند تغييره',tc),f('s-gr','مكافأة الفصل','تظهر عند هزيمة الشخصية',gr)))],
    ['الألعاب',el('div',{style:'display:flex;flex-direction:column;gap:14px'},
      el('div',{},el('b',{},'الألعاب الظاهرة'),el('small',{style:'display:block;opacity:.75'},'ألغِ التحديد لإخفاء اللعبة من الأزرار. لعبة واحدة على الأقل تبقى ظاهرة'),gameList),
      el('div',{style:'display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px'},f('s-ts','ثواني «صح أم خطأ»','الوقت مستمر حتى يخطئ الطالب',ts),f('s-cs','ثواني التحدي الفردي','',cs)))],
    ['الشخصية الشريرة',grid(f('s-bn','اسم الشخصية الشريرة','',bn),f('s-lv','مستوى الشخصية','كل مستوى بشكل جديد، ويزيد HP عند كل هزيمة',lv),f('s-gt','HP الكامل','عدد الضربات اللازمة لهزيمته',gt),f('s-hc','HP الحالي','يمكنك تعديله الآن، أو بالضغط على شريط HP',hc))],
    ['أسئلتي الخاصة',grid(f('s-qa','أسئلتي الخاصة','بالشكل: السؤال | الإجابة. تظهر عند اختيار «أسئلتي الخاصة» في درس اليوم',qa),f('s-tf','عباراتي لصح أم خطأ','بالشكل: العبارة | صح  أو  العبارة | خطأ',tf))],
    ['إعادة الضبط',el('div',{style:'display:flex;flex-direction:column;gap:10px;align-items:flex-start'},el('p',{style:'margin:0'},'يصفّر نقاط الطلاب والفرق وHP، ويعيد كل الأسئلة كأنها لم تُسأل.'),rs)]];
  let curPane=0;try{curPane=+sessionStorage.getItem('setPane')||0}catch(e){}
  const nav=el('div',{class:'snav',role:'tablist'});const body=el('div',{class:'sbody'});
  const show=i=>{curPane=i;try{sessionStorage.setItem('setPane',i)}catch(e){}[...nav.children].forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));[...body.children].forEach((d,j)=>d.hidden=j!==i)};
  panes.forEach(([t,node],i)=>{nav.append(el('button',{type:'button',role:'tab',onclick:()=>show(i)},t));body.append(el('div',{class:'spane'},node))});
  const box=el('div',{class:'box'},
    el('h2',{style:'font-size:1.8rem;margin:0'},'إعدادات الحصة'),nav,body,
    el('div',{class:'acts'},el('span'),el('div',{class:'row'},el('button',{onclick:()=>o.hidden=true},'إلغاء'),el('button',{class:'primary',onclick:apply},'حفظ'))));
  show(Math.min(curPane,panes.length-1));
  function apply(){
    const lines=t=>t.value.split('\n').map(x=>x.trim()).filter(Boolean);
    const rawStu=lines(stu),newStu=[...new Set(rawStu)];const dup=rawStu.length-newStu.length;
    const pair=l=>{const i=l.indexOf('|');return i<0?[l,'']:[l.slice(0,i).trim(),l.slice(i+1).trim()]};
    const newQa=lines(qa).map(pair);
    const newTf=lines(tf).map(pair).map(([s,v])=>[s,!/خطأ|خطا|false|x|✗/i.test(v)]);
    const n=Math.max(2,Math.min(6,+tc.value||3));
    const changedStu=newStu.join('|')!==S.students.join('|');
    if(JSON.stringify(newQa)!==JSON.stringify(S.qa)){S.quickQ=null}
    S.students=newStu;S.qa=newQa;S.tf=newTf;S.goal.target=Math.max(1,+gt.value||30);{const h=Math.max(0,Math.min(S.goal.target,Math.round(+hc.value)));S.goal.pts=isNaN(h)?Math.min(S.goal.pts,S.goal.target):S.goal.target-h}S.goal.reward=gr.value.trim()||'مكافأة';S.qSec=Math.max(5,+qs.value||20);S.tfSec=Math.max(5,+ts.value||15);S.chSec=Math.max(10,+cs.value||30);S.bossName=bn.value.trim()||'المعضلين';{const it=lines(sw).map(pair).map(([l,e])=>[l,e===''?'':/^-?\d+$/.test(e)?+e:/gold/i.test(e)?'gold':/boss/i.test(e)?'boss':'']).filter(x=>x[0]);S.surprise=it.length>=2?it:null}S.bossLv=Math.max(0,(Math.round(+lv.value)||1)-1);drawBoss($('boss-cv'));drawBoss($('dface'));
    if(changedStu||n!==S.teamCount){S.teamCount=n;splitTeams();S.bag=[];if(!S.students.includes(S.cur))S.cur=null;if(S.mode==='individual')nextStudent()}
    {const h=gameChecks.filter(c=>!c.checked).map(c=>c.dataset.id);if(h.length>=GAMES.length){toast('اترك لعبة واحدة ظاهرة على الأقل');return}S.hiddenGames=h}
    S.sample=false;save();o.hidden=true;renderAll();toast(dup?'حُفظت الإعدادات، وحُذف '+dup+' اسم مكرر':'حُفظت الإعدادات');
  }
  o.append(box);o.hidden=false;
};
$('ov-set').addEventListener('click',e=>{if(e.target.id==='ov-set')e.currentTarget.hidden=true});

/* button ripple + click sound */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height);sfx.click()});
/* sparkles */

try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
if(S.mode==='individual'&&!S.cur)nextStudent();
renderAll();
})();
