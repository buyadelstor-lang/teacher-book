<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orchid">
<meta name="theme-color" content="#DDF3FF">
<title>Orchid's Letter Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* One-screen kids' app: full-bleed scenes, big tap targets, single bright look on purpose. */
:root{
  --sky:#DDF3FF; --sea:#4FC3E8; --sand:#FFE7A8; --leaf:#5BC98A; --coral:#FF7A6B;
  --berry:#8B5CF6; --sun:#FFC83D; --ink:#22314A; --muted:#5B6B85; --card:#FFFFFF; --line:#C9E6F5;
  --en:"Andika","Baloo 2","Comic Sans MS",sans-serif; --ui:"Baloo 2","Andika",sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none;z-index:5}
.pill{background:var(--card);border-radius:999px;padding:6px 18px;font-weight:800;font-size:clamp(18px,2.6vw,26px);display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.pill .st{color:var(--sun);font-size:1.2em;line-height:1}
.rbtn{width:clamp(52px,7vw,72px);aspect-ratio:1;border-radius:50%;border:none;background:var(--card);font-size:clamp(22px,3.4vw,32px);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.1);cursor:pointer;color:var(--ink);font-family:var(--ui);font-weight:800}
.rbtn:active,.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
.big{border:none;border-radius:999px;padding:.35em 1.4em;font-family:var(--ui);font-weight:800;font-size:clamp(24px,4vw,40px);color:#fff;background:var(--berry);box-shadow:0 6px 0 #6237c9;cursor:pointer}
.big.green{background:var(--leaf);box-shadow:0 6px 0 #3a9c66}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.cat{width:clamp(70px,13vw,140px);aspect-ratio:120/130;filter:drop-shadow(0 5px 0 rgba(0,0,0,.12))}
.cat svg{width:100%;height:100%}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.happy{animation:jump .5s ease-out 2}
@keyframes jump{40%{transform:translateY(-26px) rotate(-6deg)}}
.bubble-say{background:var(--card);border-radius:22px;padding:8px 18px;font-weight:800;font-size:clamp(18px,2.8vw,28px);box-shadow:0 4px 0 rgba(0,0,0,.08);position:relative}

/* home */
#home{background:radial-gradient(circle at 50% 30%,#FFF6C9,var(--sky) 60%);align-items:center;justify-content:center;gap:3vh;text-align:center}
#home h1{margin:0;font-size:clamp(40px,8vw,84px);line-height:1;color:var(--coral);text-shadow:0 5px 0 #fff}
#home h1 span{color:var(--berry)}
#home .cat{width:clamp(130px,24vw,240px)}
#gear{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));opacity:.5}
#parent{position:absolute;inset:0;background:rgba(34,49,74,.55);display:grid;place-items:center;z-index:20}
#parent .box{background:var(--card);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:90vw;text-align:center;font-family:Tahoma,sans-serif}

/* map */
#map{background:linear-gradient(#BFE9FF 0 24%, var(--sea) 24%);padding-bottom:0}
#map .world{position:relative;flex:1;min-height:0}
#map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;padding:0;font-family:var(--en)}
.node .blob{width:clamp(78px,13vw,130px);aspect-ratio:1.25;border-radius:50%;background:var(--sand);border:5px solid #fff;display:grid;place-items:center;font-weight:700;font-size:clamp(36px,6vw,62px);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.node.done .blob{background:var(--leaf);color:#fff}
.node.now .blob{background:var(--sun);animation:bob 1.6s ease-in-out infinite}
.node.lock .blob{background:#E6EEF5;color:#A9B8CB}
.node .stars{font-size:clamp(16px,2.4vw,24px);color:var(--sun);letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.25);font-family:var(--ui)}
.node.lock .stars{color:#ffffffaa}
.far{position:absolute;display:flex;flex-direction:column;align-items:center;opacity:.85;transform:translate(-50%,-50%);pointer-events:none}
.far .blob{width:clamp(44px,7vw,70px);aspect-ratio:1.4;border-radius:50%;background:#E6EEF5;border:3px solid #fff;display:grid;place-items:center;font-size:clamp(14px,2vw,20px)}
#mapCat{position:absolute;transform:translate(-50%,-100%);transition:left .6s,top .6s;z-index:3}
.islandname{position:absolute;left:50%;top:2%;transform:translateX(-50%);font-weight:800;font-size:clamp(20px,3vw,30px);color:#1E6E93;white-space:nowrap}

/* learn */
#learn{background:linear-gradient(160deg,#FFF4D6,#FFE0E6)}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:4vw;align-items:center;padding:2vh 2vw}
@media (orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.biglet{font-family:var(--en);font-weight:700;font-size:clamp(110px,22vmin,260px);line-height:1;color:var(--coral);text-align:center;border:none;background:none;cursor:pointer}
.biglet small{color:var(--berry);font-size:.72em}
.biglet:active,.pic:active{transform:scale(.95)}
.pic{background:var(--card);border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;height:100%;max-height:60vh;box-shadow:0 8px 0 rgba(0,0,0,.06);border:none;cursor:pointer;font-family:var(--en)}
.pic .emo{font-size:clamp(90px,18vmin,200px);line-height:1}
.pic .word{font-size:clamp(36px,6vmin,64px);font-weight:700;color:var(--ink)}
.pic .word b{color:var(--coral)}
.foot{display:flex;justify-content:space-between;align-items:flex-end;flex:none;gap:12px}
.foot .cat{width:clamp(64px,10vw,110px)}

/* trace */
#trace{background:#F2FBF5}
#trace .pad{position:relative;flex:1;min-height:0}
#tc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

/* bubbles */
#bub{background:linear-gradient(#C9F0FF,#E9FBFF)}
.ask{text-align:center;font-weight:800;font-size:clamp(28px,4.4vw,48px);font-family:var(--en);margin-top:1vh}
.ask b{color:var(--coral)}
.bubbles{flex:1;display:flex;justify-content:space-around;align-items:center;gap:2vw;flex-wrap:wrap}
.bb{width:clamp(110px,22vmin,210px);aspect-ratio:1;border-radius:50%;border:none;font-family:var(--en);font-weight:700;font-size:clamp(56px,11vmin,110px);color:#fff;cursor:pointer;box-shadow:inset -10px -14px 0 rgba(0,0,0,.12),0 8px 0 rgba(0,0,0,.08);transition:transform .2s,opacity .3s}
.bb:nth-child(4n+1){background:var(--coral)}.bb:nth-child(4n+2){background:var(--leaf)}.bb:nth-child(4n+3){background:var(--berry)}.bb:nth-child(4n+4){background:#F59EB6}
.bb:nth-child(odd){animation:bob 2.4s ease-in-out infinite}.bb:nth-child(even){animation:bob 2.1s ease-in-out infinite .4s}
.bb.ok{transform:scale(1.25);opacity:0;pointer-events:none}
.bb.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.dots{display:flex;gap:10px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--line)}
.dots i.on{background:var(--sun);box-shadow:none}

/* words */
#words{background:linear-gradient(#FFF0F5,#FFE7C7)}
.wpic{font-size:clamp(100px,22vmin,200px);text-align:center;line-height:1.1;cursor:pointer;background:none;border:none}
.slots{display:flex;gap:12px;justify-content:center}
.slot{width:clamp(70px,12vmin,110px);aspect-ratio:1;border-radius:20px;background:#ffffffaa;border:4px dashed #F2B880;display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:clamp(44px,8vmin,76px);color:var(--ink)}
.slot.f{background:var(--card);border:4px solid var(--leaf)}
.tiles{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.tile{width:clamp(76px,13vmin,120px);aspect-ratio:1;border-radius:22px;border:none;background:var(--sun);font-family:var(--en);font-weight:700;font-size:clamp(46px,8vmin,80px);color:var(--ink);box-shadow:0 6px 0 #D9A21E;cursor:pointer}
.tile.used{visibility:hidden}
.wbody{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;min-height:0}

/* reward */
#reward{background:radial-gradient(circle at 50% 40%,#FFF6C9,#FFD9A0);align-items:center;justify-content:center;gap:2.5vh;text-align:center}
.three{font-size:clamp(70px,14vmin,140px);color:var(--sun);text-shadow:0 5px 0 #E5A100;line-height:1}
.three span{display:inline-block;animation:pop .5s backwards}
.three span.off{color:#ffffff99;text-shadow:none}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
.msg{font-weight:800;font-size:clamp(30px,5vw,54px);font-family:var(--en)}
.newst{font-size:clamp(70px,14vmin,130px);background:var(--card);border-radius:28px;width:1.6em;aspect-ratio:1;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.08);animation:pop .7s .9s backwards;outline:5px solid var(--berry)}
.conf{position:absolute;width:12px;height:18px;top:-20px;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* album */
#album{background:#FFF9EC}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:18px;align-content:start;padding:3vh 2vw;overflow:auto}
.stk{aspect-ratio:1;border-radius:24px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(50px,9vmin,80px);box-shadow:0 5px 0 rgba(0,0,0,.07)}
.stk span{font-family:var(--en);font-size:22px;font-weight:700}
.stk.empty{background:transparent;border:4px dashed #E8D5A8;color:#D8C08A;font-size:40px;box-shadow:none}

#buddy{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
#buddy .cat{width:clamp(80px,12vw,120px);border:none;background:none;padding:0;cursor:pointer;pointer-events:auto}
.catbtn{border:none;background:none;padding:0;cursor:pointer}
#bSay{margin-bottom:34px;max-width:min(52vw,420px);font-family:var(--en);font-size:clamp(18px,2.6vw,26px);animation:pop .35s;pointer-events:none}
#bSay:after{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
.sad{animation:sad .7s ease-in-out}
@keyframes sad{30%{transform:rotate(-10deg) translateY(4px)}70%{transform:rotate(8deg) translateY(4px)}}
.heart{position:fixed;pointer-events:none;font-size:30px;z-index:31;animation:rise 1.2s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),-140px) scale(1.4);opacity:0}}

/* worlds */
#worlds{background:linear-gradient(#BFE9FF,#E9F8FF)}
.isles{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2.4vw,24px);padding:2vh 1vw;align-content:center}
@media (orientation:portrait){.isles{grid-template-columns:repeat(3,1fr)}}
.cdot{display:inline-block;width:1em;height:1em;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 0 0 4px rgba(0,0,0,.08);vertical-align:middle}
.isle{border:none;border-radius:32px;background:var(--card);box-shadow:0 8px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:2vh 8px;cursor:pointer;font-family:var(--ui);color:var(--ink);min-height:0}
.isle:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.isle .ie{font-size:clamp(44px,7.5vmin,80px);line-height:1.1}
.isle .in{font-weight:800;font-size:clamp(20px,2.8vw,30px);line-height:1.1;text-align:center}
.isle .is{color:var(--sun);font-size:clamp(18px,2.4vw,26px);letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.isle:nth-child(6n+1){background:#FFF1D0}.isle:nth-child(6n+2){background:#FFE3EA}.isle:nth-child(6n+3){background:#E3F8EC}.isle:nth-child(6n+4){background:#EDE6FF}.isle:nth-child(6n+5){background:#FFF6D9}.isle:nth-child(6n+6){background:#E0F3FF}
/* vocab learn */
#vlearn{background:linear-gradient(160deg,#FFF6E0,#E8F7FF)}
.vcardrow{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:2vw}
.vcard{flex:0 1 min(70vw,640px);height:min(62vh,560px);background:var(--card);border-radius:36px;border:none;box-shadow:0 10px 0 rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;cursor:pointer;font-family:var(--en);color:var(--ink);padding:16px}
.vcard .ve{font-size:clamp(110px,24vmin,220px);line-height:1.05}
.vcard .vw{font-weight:700;font-size:clamp(44px,8vmin,80px);line-height:1}
.vcard .vs{font-size:clamp(20px,3vmin,30px);color:var(--muted);text-align:center}
.vcard:active{transform:scale(.97)}
.arrow{width:clamp(56px,8vw,80px);aspect-ratio:1;border-radius:50%;border:none;background:var(--berry);color:#fff;font-size:clamp(28px,4vw,40px);font-weight:800;box-shadow:0 5px 0 #6237c9;cursor:pointer;flex:none}
.arrow:disabled{opacity:.25}
.vfoot{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex:none;min-height:70px}
/* vocab game */
#vgame{background:linear-gradient(#FFF0F5,#E9FBFF)}
.vq{display:flex;flex-direction:column;align-items:center;gap:1vh;margin-top:1vh}
.vq .bigE{font-size:clamp(100px,22vmin,190px);line-height:1}
.vopts{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(12px,3vw,36px);flex-wrap:wrap;padding-bottom:12vh}
.vopt{border:none;border-radius:30px;background:var(--card);box-shadow:0 8px 0 rgba(0,0,0,.08);cursor:pointer;font-family:var(--en);color:var(--ink);position:relative}
.vopt.vpic{width:clamp(130px,24vmin,220px);aspect-ratio:1;font-size:clamp(80px,15vmin,140px);line-height:1}
.vopt.txt{padding:.5em 1em;font-size:clamp(32px,5.4vmin,56px);font-weight:700;min-width:4em}
.vopt.say{display:flex;align-items:center;gap:.4em;padding:.5em .9em .5em 1.6em;font-size:clamp(22px,3.6vmin,36px);font-weight:700;text-align:left;max-width:min(88vw,560px)}
.vopt .ear{position:absolute;left:-10px;top:-10px;width:44px;height:44px;border-radius:50%;background:var(--berry);color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 #6237c9}
.vopt.ok{outline:6px solid var(--leaf);transform:scale(1.08)}
.vopt.no{animation:shake .4s}
.vopt:active{transform:translateY(4px)}
.burst{position:absolute;pointer-events:none;font-size:34px;color:var(--sun);animation:fly .9s ease-out forwards;z-index:30}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="cat" viewBox="0 0 120 130">
  <style>.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}.tail{transform-origin:92px 112px;animation:wag 1.6s ease-in-out infinite}@keyframes wag{50%{transform:rotate(-14deg)}}@media (prefers-reduced-motion:reduce){.eye,.tail{animation:none}}</style>

  <path d="M24 40 L28 4 L52 24 Z" fill="#FFB255"/><path d="M96 40 L92 4 L68 24 Z" fill="#FFB255"/>

  <circle cx="60" cy="46" r="38" fill="#FFB255"/>
  <path d="M50 12 Q60 22 70 12" fill="none" stroke="#F39A3D" stroke-width="4" stroke-linecap="round"/>
  <g class="eye"><ellipse cx="44" cy="44" rx="7" ry="9" fill="#22314A"/><circle cx="46.5" cy="40.5" r="2.6" fill="#fff"/></g><g class="eye"><ellipse cx="76" cy="44" rx="7" ry="9" fill="#22314A"/><circle cx="78.5" cy="40.5" r="2.6" fill="#fff"/></g>
  <circle cx="32" cy="58" r="6" fill="#FF8FA3" opacity=".55"/><circle cx="88" cy="58" r="6" fill="#FF8FA3" opacity=".55"/>
  <path d="M56 55 L64 55 L60 60 Z" fill="#FF6B81"/>
  <path d="M60 60 Q55 67 50 63 M60 60 Q65 67 70 63" fill="none" stroke="#22314A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M28 54 L12 50 M28 60 L12 62 M92 54 L108 50 M92 60 L108 62" stroke="#22314A" stroke-width="2" stroke-linecap="round"/>

</symbol></defs></svg>

<!-- HOME -->
<section class="scene" id="home">
  <button class="rbtn" id="gear" aria-label="Parents (hold)">⚙︎</button>
  <div class="bubble-say" id="hSay">Hi Orchid! I'm Lulu!</div>
  <button class="cat bob catbtn lulu" aria-label="Lulu"><svg><use href="#cat"/></svg></button>
  <h1>Letter <span>Island</span></h1>
  <button class="big" id="play">▶ Play</button>
  <div id="parent" hidden><div class="box" dir="rtl">
    <b>ركن الوالدين</b>
    <div id="pstats" style="font-size:15px;color:var(--muted)"></div>
    <button class="big" style="font-size:20px;background:var(--coral);box-shadow:0 5px 0 #c9574a" id="reset">مسح التقدم والبدء من جديد</button>
    <button class="big" style="font-size:20px" id="unlockAll">فتح كل الجزر</button>
    <button class="big green" style="font-size:20px" id="pclose">إغلاق</button>
  </div></div>
</section>

<!-- MAP -->
<section class="scene" id="map" hidden>
  <div class="bar">
    <button class="rbtn" data-go="worlds" aria-label="Back">‹</button>
    <button class="pill albumOpen" id="albumBtn" style="border:none;cursor:pointer;font-family:var(--ui)">📒 Stickers</button>
    <span class="pill"><span class="st">★</span><span id="total">0</span></span>
  </div>
  <div class="world" id="world">
    <div class="islandname" id="isleName">Apple Island</div>
    <svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path id="trail" fill="none" stroke="#fff" stroke-width=".9" stroke-dasharray="1 16" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:7px"/></svg>
    <button id="mapCat" class="cat catbtn lulu" aria-label="Lulu"><svg><use href="#cat"/></svg></button>
  </div>
</section>

<!-- LEARN -->
<section class="scene" id="learn" hidden>
  <div class="bar"><button class="rbtn" data-go="map" aria-label="Back">‹</button><span class="pill">Listen</span><span style="width:60px"></span></div>
  <div class="stage">
    <button class="biglet" id="lLet">A<small>a</small></button>
    <button class="pic" id="lPic"><div class="emo">🍎</div><div class="word"><b>a</b>pple</div></button>
  </div>
  <div class="foot"><span></span><button class="big green" id="lNext">Next ▶</button></div>
</section>

<!-- TRACE -->
<section class="scene" id="trace" hidden>
  <div class="bar"><button class="rbtn" data-go="map" aria-label="Back">‹</button><span class="pill">✏️ Write <span id="tLet" style="font-family:var(--en);color:var(--coral)">A</span></span><button class="rbtn" id="tClear" aria-label="Clear">↺</button></div>
  <div class="pad"><canvas id="tc"></canvas></div>
</section>

<!-- BUBBLES -->
<section class="scene" id="bub" hidden>
  <div class="bar"><button class="rbtn" data-go="map" aria-label="Back">‹</button><div class="dots" id="bDots"></div><button class="rbtn" id="bAgain" aria-label="Listen again">🔊</button></div>
  <div class="ask">Where is <b id="bT">A</b>?</div>
  <div class="bubbles" id="bWrap"></div>
</section>

<!-- WORDS -->
<section class="scene" id="words" hidden>
  <div class="bar"><button class="rbtn" data-go="map" aria-label="Back">‹</button><div class="dots" id="wDots"></div><button class="rbtn" id="wAgain" aria-label="Listen again">🔊</button></div>
  <div class="wbody">
    <div class="ask" id="wAsk">Which letter does it start with?</div>
    <button class="wpic" id="wPic">🍎</button>
    <div class="slots" id="wSlots"></div>
    <div class="tiles" id="wTiles"></div>
  </div>
</section>

<!-- REWARD -->
<section class="scene" id="reward" hidden>
  <div class="three" id="rStars"></div>
  <div class="msg" id="rMsg">Great job, Orchid!</div>
  <div style="display:flex;align-items:center;gap:20px"><div class="cat happy" id="rCat"><svg><use href="#cat"/></svg></div><div class="newst" id="rSt">🍎</div></div>
  <button class="big green" id="rGo">Continue ▶</button>
</section>

<!-- WORLDS -->
<section class="scene" id="worlds" hidden>
  <div class="bar">
    <button class="rbtn" data-go="home" aria-label="Home">⌂</button>
    <button class="pill albumOpen" style="border:none;cursor:pointer;font-family:var(--ui)">📒 Stickers</button>
    <span class="pill"><span class="st">★</span><span id="wTotal">0</span></span>
  </div>
  <div class="isles" id="isles"></div>
</section>

<!-- VOCAB LEARN -->
<section class="scene" id="vlearn" hidden>
  <div class="bar"><button class="rbtn" data-go="worlds" aria-label="Back">‹</button><span class="pill" id="vTitle">My Family</span><div class="dots" id="vDots"></div></div>
  <div class="vcardrow"><button class="arrow" id="vPrev" aria-label="Back">‹</button><button class="vcard" id="vCard"></button><button class="arrow" id="vNext" aria-label="Next">›</button></div>
  <div class="vfoot"><button class="big green" id="vPlay" hidden>Let's play ▶</button></div>
</section>

<!-- VOCAB GAME -->
<section class="scene" id="vgame" hidden>
  <div class="bar"><button class="rbtn" data-go="worlds" aria-label="Back">‹</button><div class="dots" id="gDots"></div><button class="rbtn" id="gAgain" aria-label="Listen again">🔊</button></div>
  <div class="vq"><div class="ask" id="gAsk"></div><div class="bigE" id="gE"></div></div>
  <div class="vopts" id="gOpts"></div>
</section>

<!-- ALBUM -->
<section class="scene" id="album" hidden>
  <div class="bar"><button class="rbtn" data-go="map" aria-label="Back">‹</button><span class="pill">📒 My Stickers</span><span style="width:60px"></span></div>
  <div class="grid" id="aGrid"></div>
</section>

const tc=$('tc'),tx=tc.getContext('2d');let box,strokes,si,hits,ink,drawing=false;
function bez(s,t){const [,x0,y0,x1,y1,x2,y2,x3,y3]=s,u=1-t;return[u*u*u*x0+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x3,u*u*u*y0+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y3];}
function samplePts(stroke){const pts=[];stroke.forEach(s=>{const n=24;for(let k=0;k<=n;k++){const t=k/n;pts.push(s[0]==='L'?[s[1]+(s[3]-s[1])*t,s[2]+(s[4]-s[2])*t]:bez(s,t));}});return pts;}
function startTrace(){const L=LET[li].L;$('tLet').textContent=L;strokes=STROKES[L].map(samplePts);si=0;hits=strokes.map(p=>p.map(()=>false));ink=[];show('trace');sizeT();play('trace');}
function sizeT(){const r=tc.getBoundingClientRect(),d=window.devicePixelRatio||1;if(!r.width)return;tc.width=r.width*d;tc.height=r.height*d;tx.setTransform(d,0,0,d,0,0);const s=Math.min(r.width,r.height)*.86;box={x:(r.width-s)/2,y:(r.height-s)/2,s:s,w:r.width,h:r.height};drawT();}
const P=p=>[box.x+p[0]/100*box.s,box.y+p[1]/100*box.s];
function path(pts){tx.beginPath();pts.forEach((p,i)=>{const q=P(p);i?tx.lineTo(q[0],q[1]):tx.moveTo(q[0],q[1]);});}
function drawT(){if(!box||!strokes)return;tx.clearRect(0,0,box.w,box.h);tx.lineCap='round';tx.lineJoin='round';
  const lw=box.s*.13;
  strokes.forEach((pts,i)=>{path(pts);tx.strokeStyle=i<si?'#5BC98A':'#DCEFE3';tx.lineWidth=lw;tx.stroke();});
  if(si<strokes.length){const pts=strokes[si];path(pts);tx.setLineDash([2,box.s*.045]);tx.strokeStyle='#3FA56F';tx.lineWidth=box.s*.022;tx.stroke();tx.setLineDash([]);
    // arrow at ~35%
    const a=P(pts[Math.floor(pts.length*.35)]),b=P(pts[Math.floor(pts.length*.35)+2]);const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);tx.save();tx.translate(a[0],a[1]);tx.rotate(ang);tx.fillStyle='#3FA56F';tx.beginPath();tx.moveTo(box.s*.04,0);tx.lineTo(-box.s*.02,-box.s*.03);tx.lineTo(-box.s*.02,box.s*.03);tx.fill();tx.restore();
    const s0=P(pts[0]);tx.fillStyle=COLORS[si%3];tx.beginPath();tx.arc(s0[0],s0[1],box.s*.05,0,7);tx.fill();tx.fillStyle='#fff';tx.font='700 '+(box.s*.06)+'px Andika, sans-serif';tx.textAlign='center';tx.textBaseline='middle';tx.fillText(si+1,s0[0],s0[1]+1);}
  tx.strokeStyle='#FF7A6B';tx.lineWidth=box.s*.045;ink.forEach(s=>{tx.beginPath();s.forEach((p,i)=>i?tx.lineTo(p[0],p[1]):tx.moveTo(p[0],p[1]));tx.stroke();});}
function tpos(e){const r=tc.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function mark(p){if(si>=strokes.length)return;const R=box.s*.11;strokes[si].forEach((q,k)=>{const Q=P(q);if(Math.hypot(Q[0]-p[0],Q[1]-p[1])<R)hits[si][k]=true;});}
tc.addEventListener('pointerdown',e=>{if(!strokes)return;drawing=true;tc.setPointerCapture(e.pointerId);const p=tpos(e);ink.push([p]);mark(p);drawT();});
tc.addEventListener('pointermove',e=>{if(!drawing)return;const p=tpos(e);ink[ink.length-1].push(p);mark(p);drawT();});
function tEnd(){if(!drawing)return;drawing=false;const h=hits[si],ok=h.filter(Boolean).length/h.length;
  if(ok>=.8&&h[0]&&h[h.length-1]){si++;ink=[];drawT();sparkle(tc,box.w/2,box.h/2);
    luluHappy();if(si>=strokes.length){play('traceok').then(()=>startBubbles());}else play(si===1&&strokes.length>2?'tracehalf':pick(['yes','cheer3']));}
  else if(ok<.3&&ink.length>0){ink=[];hits[si]=hits[si].map(()=>false);drawT();luluSad();play(pick(['oops3','traceme']));}
}
tc.addEventListener('pointerup',tEnd);tc.addEventListener('pointercancel',tEnd);
$('tClear').onclick=()=>{ink=[];if(hits)hits[si]=hits[si].map(()=>false);drawT();};
new ResizeObserver(()=>{if(!$('trace').hidden)sizeT();}).observe(tc);

const ROUNDS=5;let br,bTarget,bLower;
function startBubbles(){br=0;show('bub');nextBubble();}
function dots(el,n,k){el.innerHTML='';for(let i=0;i<n;i++){const d=document.createElement('i');if(i<k)d.className='on';el.appendChild(d);}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function nextBubble(){
  if(br>=ROUNDS){finishLetter();return;}
  dots($('bDots'),ROUNDS,br);
  const pool=(li<2?LET.slice(0,3):LET.slice(Math.max(0,li-4),li+1)).map(x=>x.L);
  bTarget=(br%2===0||pool.length<2)?LET[li].L:pool[Math.floor(Math.random()*pool.length)];
  bLower=br>=3;
  const others=shuffle(pool.filter(x=>x!==bTarget)).slice(0,2);
  if(others.length<2)others.push(...shuffle('EFGHMOST'.split('')).slice(0,2-others.length));
  const opts=shuffle([bTarget,...others]);
  $('bT').textContent=bLower?bTarget.toLowerCase():bTarget;
  const wrap=$('bWrap');wrap.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.className='bb';b.textContent=bLower?o.toLowerCase():o;b.onclick=()=>pickB(b,o);wrap.appendChild(b);});
  play('Q_'+bTarget);
}
$('bAgain').onclick=()=>play('Q_'+bTarget);
let bBusy=false;
function pickB(b,o){
  if(bBusy)return;
  if(o===bTarget){bBusy=true;const r=b.getBoundingClientRect();sparkle(document.body,r.left+r.width/2,r.top+r.height/2,true);b.classList.add('ok');br++;dots($('bDots'),ROUNDS,br);
    luluHappy();play([pick(['cheer1','cheer2','cheer3','great','awesome','yes']),'L_'+o]).then(()=>setTimeout(()=>{bBusy=false;nextBubble();},200));}
  else{mistakes++;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');luluSad();play([pick(['tryagain','oops2','oops3']),'Q_'+bTarget]);}
}

$('vPlay').onclick=()=>startVGame();
function startVGame(){vr=0;vm=0;const items=V[vk].items;
  if(vk==='me'){vRounds=shuffle(MEQ.slice()).slice(0,5).map(q=>({t:'talk',q}));}
  else{vRounds=shuffle(items.slice()).slice(0,4).map(it=>({t:'find',it})).concat(shuffle(items.slice()).slice(0,3).map(it=>({t:'read',it})));}
  show('vgame');$('gOpts').innerHTML='';$('gAsk').textContent='';$('gE').textContent='';play(vk==='me'?'talkq':'letsplay').then(nextV);}
function opts(ans,n){return shuffle([ans].concat(shuffle(V[vk].items.filter(x=>x!==ans)).slice(0,n-1)));}
function nextV(){vBusy=false;
  if(vr>=vRounds.length){const st=starsFor(vm);S.isl=S.isl||{};S.isl[vk]=Math.max(S.isl[vk]||0,st);const e=V[vk].e,isNew=!S.stickers.includes(e);if(isNew)S.stickers.push(e);save();reward(st,e,isNew,'vocab');return;}
  dots($('gDots'),vRounds.length,vr);const R=vRounds[vr],box=$('gOpts');box.innerHTML='';$('gE').textContent='';
  if(R.t==='find'){$('gAsk').innerHTML='Where is <b>'+R.it.w+'</b>?';
    opts(R.it,3).forEach(o=>{const b=document.createElement('button');b.className='vopt vpic';b.innerHTML=o.e;b.setAttribute('aria-label',o.w);b.onclick=()=>answer(b,o===R.it,['V_'+o.w]);box.appendChild(b);});
    R.again=['Q_'+R.it.w];}
  else if(R.t==='read'){$('gAsk').textContent='Which word is it?';$('gE').innerHTML=R.it.e;
    opts(R.it,3).forEach(o=>{const b=document.createElement('button');b.className='vopt txt';b.textContent=o.w;b.onclick=()=>answer(b,o===R.it,['V_'+R.it.w,'X_'+R.it.w]);box.appendChild(b);});
    R.again=['readq'];}
  else{const q=R.q,ans=V.me.items.find(x=>x.w===q.a);$('gAsk').textContent=q.t;
    const others=shuffle(V.me.items.filter(x=>x!==ans)).slice(0,2);
    shuffle([ans].concat(others)).forEach(o=>{const b=document.createElement('button');b.className='vopt say';b.innerHTML='<span class="ear">🔊</span><span style="font-size:1.4em">'+o.e+'</span><span>'+o.s+'</span>';
      b.querySelector('.ear').onclick=e=>{e.stopPropagation();play('V_'+o.w);};
      b.onclick=()=>answer(b,o===ans,['V_'+o.w]);box.appendChild(b);});
    R.again=[q.k];}
  play(R.again);}
$('gAgain').onclick=()=>{const R=vRounds&&vRounds[vr];if(R)play(R.again);};
function answer(b,ok,after){if(vBusy)return;
  if(ok){vBusy=true;b.classList.add('ok');const r=b.getBoundingClientRect();sparkle(document.body,r.left+r.width/2,r.top+r.height/2,true);luluHappy();vr++;dots($('gDots'),vRounds.length,vr);
    play([pick(['yes','cheer1','cheer2','cheer3','great','awesome'])].concat(after)).then(()=>setTimeout(nextV,250));}
  else{vm++;b.classList.remove('no');void b.offsetWidth;b.classList.add('no');luluSad();play(pick(['tryagain','oops2','oops3']));}}
// ---------- album ----------
function drawAlbum(){const all=LET.map(x=>[x.e,x.L]).concat(ISL.map(I=>[I.t,I.name]),Object.values(V).map(v=>[v.e,v.name]));const g=$('aGrid');g.innerHTML='';
  all.forEach(([e,n])=>{const d=document.createElement('div');const have=S.stickers.includes(e);d.className='stk'+(have?'':' empty');d.innerHTML=have?e+'<span style="font-size:16px;text-align:center">'+n+'</span>':'?';g.appendChild(d);});}
document.querySelectorAll('.albumOpen').forEach(b=>b.onclick=()=>show('album'));
})();
</script>
