<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0}</style></head><body><title>دفتر المعلم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: "crayon box" — cream page, each section owns a crayon color (tab, heading, accents); sticker cards with thick ink outline + offset shadow */
:root{
  --bg:#FFF8EC; --surface:#FFFFFF; --sunk:#FFF0D9; --ink:#2A2140; --muted:#6B5F80; --line:#EADFCB; --edge:#2A2140;
  --board:#2A2140; --board-2:#3C3159; --board-ink:#FFF8EC;
  --accent:#F5B935; --accent-ink:#4A3200; --accent-soft:#FDEBC0;
  --ok:#2E9E5B; --ok-soft:#DDF5E5; --bad:#E5484D; --bad-soft:#FDE1E1; --warn:#C27C00; --warn-soft:#FDEFCF; --info:#3D7BE0; --info-soft:#DEE9FC;
  --k-coral:#FF7A59; --k-blue:#4C8DF6; --k-teal:#2FB0A2; --k-pink:#EF5DA8; --k-purple:#8A6CE0; --k-sun:#F5B935; --k-green:#5DBB4F; --k-gray:#8C8399;
  --sec:var(--k-coral); --sec-ink:#1E1733;
  --display:"Baloo Bhaijaan 2","Readex Pro",Tahoma,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1630; --surface:#252040; --sunk:#2E2850; --ink:#F5F0FF; --muted:#B4A9CF; --line:#3A3360; --edge:#6E62A3;
  --board:#2E2850; --board-2:#3A3363; --board-ink:#F5F0FF;
  --accent:#FFC94D; --accent-ink:#3A2700; --accent-soft:#3D3215;
  --ok:#55C97F; --ok-soft:#163626; --bad:#FF6B6F; --bad-soft:#3E1C22; --warn:#FFBE3D; --warn-soft:#3B2E12; --info:#7AA7FF; --info-soft:#1C2848;
  --k-coral:#FF8A6B; --k-blue:#6A9FFF; --k-teal:#3CC4B5; --k-pink:#FF74B8; --k-purple:#A08AF0; --k-sun:#FFC94D; --k-green:#72CC64; --k-gray:#A39BB3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1630; --surface:#252040; --sunk:#2E2850; --ink:#F5F0FF; --muted:#B4A9CF; --line:#3A3360; --edge:#6E62A3;
  --board:#2E2850; --board-2:#3A3363; --board-ink:#F5F0FF;
  --accent:#FFC94D; --accent-ink:#3A2700; --accent-soft:#3D3215;
  --ok:#55C97F; --ok-soft:#163626; --bad:#FF6B6F; --bad-soft:#3E1C22; --warn:#FFBE3D; --warn-soft:#3B2E12; --info:#7AA7FF; --info-soft:#1C2848;
  --k-coral:#FF8A6B; --k-blue:#6A9FFF; --k-teal:#3CC4B5; --k-pink:#FF74B8; --k-purple:#A08AF0; --k-sun:#FFC94D; --k-green:#72CC64; --k-gray:#A39BB3;
  color-scheme:dark}
body[data-tab="attendance"]{--sec:var(--k-coral)}
body[data-tab="students"]{--sec:var(--k-blue);--sec-ink:#fff}
body[data-tab="grades"]{--sec:var(--k-teal)}
body[data-tab="homework"]{--sec:var(--k-pink);--sec-ink:#fff}
body[data-tab="schedule"]{--sec:var(--k-purple);--sec-ink:#fff}
body[data-tab="rewards"]{--sec:var(--k-sun);--sec-ink:#4A3200}
body[data-tab="rules"]{--sec:var(--k-green)}
body[data-tab="setup"]{--sec:var(--k-gray)}
body[data-tab="activity"]{--sec:var(--k-pink);--sec-ink:#fff}
/* alternating student rows: light, then a slightly darker shade, so the row you are grading is easy to follow */
:root{--row-a:var(--surface);--row-b:color-mix(in srgb,var(--k-sun) 26%,var(--surface))}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:800;line-height:1.25}
h2{font-size:1.75rem}
h3{font-size:1.15rem;font-weight:700}
.num,input[type=number]{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sec);outline-offset:2px}

/* header */
.board{background:var(--bg);color:var(--ink);border-bottom:3px solid var(--edge)}
.board .wrap{padding-block:22px 0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.title-block{display:flex;flex-direction:column;gap:0;min-width:0}
.eyebrow{font-size:.85rem;color:var(--muted);font-weight:500}
.board h1{font-size:clamp(2rem,5vw,2.9rem);line-height:1.1;position:relative;display:inline-block}
.board h1::after{content:"";display:block;height:7px;margin-top:2px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--k-coral) 0 18%,var(--k-sun) 18% 36%,var(--k-teal) 36% 54%,var(--k-blue) 54% 72%,var(--k-purple) 72% 90%,var(--k-pink) 90% 100%)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:0;font-size:.88rem;color:var(--muted)}
.meta strong{color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.05rem}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;margin-top:2px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="ok"] i{background:var(--ok)}.sync[data-s="busy"] i{background:var(--accent)}.sync[data-s="local"] i{background:var(--warn)}.sync[data-s="err"] i{background:var(--bad)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
nav.tabs button{--tc:var(--k-gray);background:var(--surface);border:2.5px solid var(--edge);border-bottom:0;color:var(--ink);padding:7px 14px 8px;border-radius:14px 14px 0 0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:.98rem;position:relative;top:3px;transition:transform .12s,padding .12s}
nav.tabs button::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc);margin-inline-end:7px;vertical-align:1px}
nav.tabs button:hover{transform:translateY(-3px)}
nav.tabs button[aria-selected="true"]{background:var(--tc);color:var(--tc-ink,#1E1733);padding-block:11px 11px}
nav.tabs button[aria-selected="true"]::before{background:currentColor}
@media (max-width:640px){nav.tabs button{font-size:.88rem;padding:6px 10px 7px}}
@media (max-width:640px){nav.tabs{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding-top:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav.tabs::-webkit-scrollbar{display:none}nav.tabs button{flex:0 0 auto;white-space:nowrap}}
/* phones and tablets: bigger tap targets, no double-tap zoom delay, and 16px fields so iOS does not zoom in on focus */
button,select,input,label,summary{touch-action:manipulation}
@media (pointer:coarse){
  .ded,.awd,.seg button,.btn,.rtabs button,.act-go,nav.tabs button{min-height:42px}
  .ded,.awd{padding-inline:14px;font-size:.9rem}
  .icon{min-width:42px;min-height:42px}
  input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{font-size:16px;min-height:42px}
  input[type=checkbox]{width:22px;height:22px}
}

main .wrap{padding-block:26px 64px}
.panel{display:flex;flex-direction:column;gap:20px}
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.phead h2{display:inline-block;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--sec) 45%,transparent) 58% 92%,transparent 92%);padding-inline:4px}
.phead p{margin:4px 0 0;color:var(--muted);font-size:.92rem;max-width:70ch}
.card{background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);padding:16px;box-shadow:4px 4px 0 var(--edge)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:880px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* controls */
.btn{border:2px solid var(--edge);background:var(--surface);padding:6px 15px;border-radius:12px;cursor:pointer;font-family:var(--display);font-weight:700;white-space:nowrap;box-shadow:2px 2px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--edge)}
.btn.primary{background:var(--sec);color:var(--sec-ink)}
.btn.accent{background:var(--k-sun);color:#4A3200}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 11px;font-size:.88rem}
.icon{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px;font-size:1rem;line-height:1}
.icon:hover{background:var(--sunk);color:var(--ink)}
.icon.del:hover{color:var(--bad)}
.icon:disabled{opacity:.3;cursor:default}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sec);box-shadow:0 0 0 3px color-mix(in srgb,var(--sec) 25%,transparent)}
.flat{border-color:transparent!important;background:transparent!important;padding:4px 6px!important;width:100%}
.flat:hover{border-color:var(--line)!important}
.flat:focus{background:var(--surface)!important;border-color:var(--sec)!important}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f input,label.f textarea{color:var(--ink);font-size:.95rem}
summary{font-weight:500}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 13px;border-radius:99px;font-size:.9rem;font-weight:600;background:var(--sunk);border:2px solid transparent}
.chip b{font-family:var(--display);font-size:1.05rem}
.c-p{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}.c-a{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}.c-l{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}.c-e{background:var(--info-soft);color:var(--info);border-color:var(--info)}

/* attendance */
.att{display:flex;flex-direction:column;padding:6px;gap:4px}
.att-row{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--row-a);border:2px solid transparent}
.att-row:nth-child(even){background:var(--row-b)}
.att-row .n{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--sec);color:var(--sec-ink);font-family:var(--display);font-weight:800;font-size:.9rem}
.att-row .nm{font-weight:600;overflow-wrap:anywhere}
.seg{display:inline-flex;gap:4px}
.seg button{border:2px solid var(--line);background:var(--surface);padding:3px 11px;cursor:pointer;font-size:.86rem;color:var(--muted);border-radius:99px;font-weight:500}
.seg button:hover{border-color:var(--edge);color:var(--ink)}
.seg button.on{color:#fff;font-weight:700}
.seg button.on[data-v="p"]{background:var(--ok);border-color:var(--ok)}
.seg button.on[data-v="a"]{background:var(--bad);border-color:var(--bad)}
.seg button.on[data-v="l"]{background:var(--warn);border-color:var(--warn)}
.seg button.on[data-v="e"]{background:var(--info);border-color:var(--info)}
.deds{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px}
.ded{border:2px dashed var(--line);background:transparent;border-radius:99px;padding:1px 11px;font-size:.8rem;color:var(--muted);cursor:pointer}
.ded:hover{border-color:var(--bad);color:var(--bad)}
.ded.on{background:var(--bad-soft);color:var(--bad);border:2px solid var(--bad);font-weight:700}
.awd{border:2px solid var(--line);background:color-mix(in srgb,var(--k-sun) 10%,var(--surface));border-radius:99px;padding:1px 11px;font-size:.8rem;color:var(--ink);cursor:pointer}
.awd b{color:var(--warn)}
.awd:hover{border-color:var(--k-sun)}
.awd.on{background:var(--k-sun);border-color:var(--edge);color:#4A3200;font-weight:700}.awd.on b{color:#4A3200}
.awd:active{transform:scale(.95)}
.gain{color:var(--warn);font-size:.82rem;font-weight:700;background:var(--accent-soft);border-radius:99px;padding:0 8px}
.pt-row .awds{grid-column:auto}
.pick{border-style:dashed;background:color-mix(in srgb,var(--k-sun) 12%,var(--surface))}
th .mx{display:inline-flex;gap:6px;align-items:center;font-weight:400;font-size:.82rem;margin-top:3px}
th .mx input{width:4.6rem;padding:2px 6px;text-align:center;color:var(--ink);font-family:var(--body)}
.bal{display:inline-block;background:var(--accent-soft);color:var(--warn);font-weight:700;border-radius:99px;padding:0 10px;font-size:.84rem;margin-inline-start:6px;white-space:nowrap}
.pick-pts{text-align:center;color:var(--warn);font-weight:700;margin-top:-8px}
.act-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:2.5px solid var(--edge);border-radius:12px;padding:8px;text-align:center;background:var(--surface);font-weight:600;font-size:.92rem;box-shadow:3px 3px 0 var(--edge);overflow-wrap:anywhere;min-height:4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .05s}
.tile small{color:var(--muted);font-weight:500}
.tile.done{opacity:.4;box-shadow:none}
.tile.lit{background:var(--k-sun);color:#4A3200;transform:translate(-2px,-2px) scale(1.05)}
.tile.lit small{color:#4A3200}
.tile.won{background:var(--k-pink);color:#fff;animation:wonpulse .3s ease-in-out 3}
.tile.won small{color:#fff}
@keyframes wonpulse{50%{transform:scale(1.14)}}
.act-go{font-family:var(--display);font-weight:800;font-size:1.6rem;background:var(--k-pink);color:#fff;border:3px solid var(--edge);border-radius:99px;padding:10px 38px;cursor:pointer;box-shadow:0 6px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.act-go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.act-go:disabled{opacity:.6;cursor:default}
.act-win{background:var(--surface);border:3px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--edge);padding:16px;text-align:center;display:flex;flex-direction:column;gap:2px;animation:winpop .45s cubic-bezier(.2,1.6,.4,1)}
.act-name{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.25;overflow-wrap:anywhere}
.act-pts{font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--warn)}
@keyframes winpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.tile.won,.act-win{animation:none}}
.rec{font-size:.8rem;font-weight:700;border-radius:99px;padding:0 9px;margin-inline-start:4px}
.rec.ok{background:var(--ok-soft);color:var(--ok)}.rec.no{background:var(--bad-soft);color:var(--bad)}
.pick-name{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,5vw,2.5rem);text-align:center;padding:10px 6px;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.pick-end{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0}
.pick-end b{font-family:var(--display);font-size:1.7rem;color:var(--ok)}
.lost{color:var(--bad);font-size:.82rem;font-weight:700;background:var(--bad-soft);border-radius:99px;padding:0 8px}
.minus{display:block;color:var(--bad);font-size:.75rem;font-weight:600}
@media (max-width:560px){.att-row{grid-template-columns:2.2rem minmax(0,1fr)}.att-row .seg,.deds{grid-column:1/-1}.seg{width:100%}.seg button{flex:1;padding-inline:4px}}
.datebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dlabel{font-family:var(--display);font-weight:700;font-size:1.15rem}
.side-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.side-list li{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:6px 0;border-bottom:2px dotted var(--line);font-size:.92rem}
.side-list li:last-child{border-bottom:0}
aside .card h3::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--sec);margin-inline-end:8px;transform:rotate(12deg)}

/* tables */
.tbox{overflow-x:auto;border:2.5px solid var(--edge);border-radius:var(--r);background:var(--surface);box-shadow:4px 4px 0 var(--edge)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:2px solid var(--line);text-align:start;vertical-align:middle}
th{background:var(--sec);color:var(--sec-ink);font-family:var(--display);font-weight:700;font-size:.92rem;white-space:nowrap;border-bottom:2.5px solid var(--edge)}
tbody tr td{background:var(--row-a)}
tbody tr:nth-child(even) td{background:var(--row-b)}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.g-in{width:4.6rem;text-align:center}
.pill{display:inline-block;padding:1px 11px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap;border:2px solid currentColor}
.r5{background:var(--ok-soft);color:var(--ok)}.r4{background:var(--info-soft);color:var(--info)}.r3{background:var(--accent-soft);color:var(--warn)}.r2{background:var(--warn-soft);color:var(--warn)}.r1{background:var(--bad-soft);color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:60px;border:2px solid var(--line)}
.bar span{display:block;height:100%;background:var(--sec);border-radius:99px}

/* items editor */
.items{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.item.three{grid-template-columns:minmax(0,1fr) 6.5rem auto}
.item.awrow{grid-template-columns:minmax(0,1fr) 5.5rem auto auto;align-items:center}
.item.rr{grid-template-columns:auto 9.5rem 5rem minmax(0,1fr) 6rem auto;align-items:center}
@media (max-width:640px){.item.rr{grid-template-columns:1fr 1fr}}
.item.shopi{grid-template-columns:minmax(0,1fr) 5.5rem 6.5rem auto}
.item.four{grid-template-columns:minmax(0,1fr) 8rem auto}
.item.dd{grid-template-columns:minmax(0,1fr) 5rem 9.5rem auto}
.item.rnd{grid-template-columns:minmax(0,1fr) auto auto auto auto;align-items:end;padding-bottom:6px;border-bottom:2px dotted var(--line)}
.item.rnd .pill{margin-bottom:8px}.item.rnd .icon{margin-bottom:4px}
@media (max-width:720px){.item.rnd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.item.rnd>input{grid-column:1/-1}}
.rtabs{display:flex;flex-wrap:wrap;gap:8px}
.rtabs button{border:2.5px solid var(--edge);background:var(--surface);border-radius:99px;padding:4px 16px;cursor:pointer;font-family:var(--display);font-weight:700}
.rtabs button[aria-pressed="true"]{background:var(--sec);color:var(--sec-ink);box-shadow:2px 2px 0 var(--edge)}
.clock{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.round-now{display:inline-flex;align-items:center;gap:6px;background:var(--k-sun);color:#4A3200;border:2px solid var(--edge);border-radius:99px;padding:1px 12px;font-size:.82rem;font-weight:600;margin-top:4px}
.round-now:empty{display:none}
.rsel{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem;margin-top:6px}
.rsel[hidden]{display:none}
.rsel select{font-weight:700;border:2.5px solid var(--edge);border-radius:99px;background:var(--k-sun);color:#4A3200;padding:3px 12px;min-height:32px;cursor:pointer}
@media (max-width:520px){.item.dd{grid-template-columns:minmax(0,1fr) 4.5rem auto}.item.dd select{grid-column:1/3}}
.rule{grid-template-columns:2.2rem minmax(0,1fr) auto auto auto}
.rule .k{font-family:var(--display);font-weight:800;color:var(--sec-ink);background:var(--sec);border-radius:50%;width:2rem;height:2rem;display:grid;place-items:center}

/* homework */
.hw{border:2.5px solid var(--edge);border-radius:var(--r);background:var(--surface);box-shadow:4px 4px 0 var(--edge);border-inline-start-width:10px;border-inline-start-color:var(--sec)}
.hw-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 14px;align-items:center}
.hw-h .t{font-family:var(--display);font-weight:700;font-size:1.1rem}
.hw-h .d{font-size:.84rem;color:var(--muted)}
.hw-body{border-top:2px dashed var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.due-over{color:var(--bad);font-weight:600}.due-today{color:var(--warn);font-weight:600}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:12px;background:var(--sunk);cursor:pointer;font-size:.9rem;border:2px solid transparent}
.checks label.done{background:var(--ok-soft);color:var(--ok);font-weight:600;border-color:var(--ok)}
.checks input{accent-color:var(--ok);width:1.05rem;height:1.05rem}

/* schedule */
.sched td{padding:4px;min-width:110px}
.sched th.today{background:var(--k-sun);color:#4A3200}
.sched td.today{background:color-mix(in srgb,var(--k-sun) 18%,transparent)!important}
.sched .plabel{font-family:var(--display);font-weight:700;white-space:nowrap}
.sched .ptime{font-size:.78rem;color:var(--muted);white-space:nowrap}

/* store */
.pts{display:flex;flex-direction:column}
.pt-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--row-a)}
.pt-row:nth-child(even){background:var(--row-b)}
.pts{gap:4px}
.score{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--warn);min-width:2.5rem;text-align:center}
.score::before{content:"★ ";font-size:.85rem}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.prize{border:2.5px solid var(--edge);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;box-shadow:3px 3px 0 var(--edge)}
.lb-hero{text-align:center;background:linear-gradient(135deg,#FFD84D,#FFB300);color:#3A2600;border:3px solid var(--edge);border-radius:22px;box-shadow:6px 6px 0 var(--edge);padding:18px 14px 20px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.lb-crown{font-size:2.8rem;line-height:1;animation:crownbob 1.8s ease-in-out infinite}
.lb-label{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.02em;opacity:.85}
.lb-first{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.4rem);line-height:1.2;overflow-wrap:anywhere}
.lb-pts{font-family:var(--display);font-weight:800;font-size:1.6rem;background:#3A2600;color:#FFD84D;border-radius:99px;padding:2px 20px;margin-top:6px}
@keyframes crownbob{50%{transform:translateY(-6px) rotate(-4deg)}}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:2.5px solid var(--edge);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--edge)}
.lb-row.top{background:color-mix(in srgb,var(--k-teal) 16%,var(--surface))}
.lb-rank{font-family:var(--display);font-weight:800;font-size:1.25rem;text-align:center;min-width:2.4rem}
.lb-name,.lb-first{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.lb-name{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere;flex:0 1 auto}
.lb-name:hover,.lb-first:hover{text-decoration:underline wavy;text-underline-offset:5px}
.lb-first{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.4rem);line-height:1.2;text-align:center}
.pop{animation:lbpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes lbpop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-2deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.lb-score{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1;background:var(--k-sun);color:#4A3200;border:2.5px solid var(--edge);border-radius:99px;padding:5px 16px;box-shadow:2px 2px 0 var(--edge);white-space:nowrap}

@media (prefers-reduced-motion:reduce){.lb-crown{animation:none}}
.store-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border:3px solid var(--edge);border-radius:var(--r);padding:12px 16px;background:var(--k-sun);color:#4A3200;box-shadow:4px 4px 0 var(--edge)}
.store-top .muted{color:#4A3200}
.bal-big{font-family:var(--display);font-weight:800;font-size:1.5rem}
.shop{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.prize{align-items:center;text-align:center;padding:20px 14px;font-size:1.05rem;transition:transform .12s}
.prize:hover{transform:translateY(-3px) rotate(-.6deg)}
.prize .ico{font-size:2.6rem;line-height:1;background:var(--surface);border:2.5px solid var(--edge);border-radius:50%;width:4.4rem;height:4.4rem;display:grid;place-items:center}
.prize .cost{font-size:2rem}
.prize.out{opacity:.55;filter:grayscale(.6)}
.prize .btn{width:100%}
.prize:nth-child(4n+1){background:color-mix(in srgb,var(--k-coral) 14%,var(--surface))}
.prize:nth-child(4n+2){background:color-mix(in srgb,var(--k-teal) 14%,var(--surface))}
.prize:nth-child(4n+3){background:color-mix(in srgb,var(--k-purple) 14%,var(--surface))}
.prize:nth-child(4n+4){background:color-mix(in srgb,var(--k-blue) 14%,var(--surface))}
.prize .cost{font-family:var(--display);font-weight:800;font-size:1.7rem;color:var(--warn);line-height:1}
.prize .cost small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:500}

/* rules presentation */
.present{background:var(--surface);border:3px solid var(--edge);box-shadow:6px 6px 0 var(--edge);border-radius:22px;padding:28px clamp(18px,4vw,44px)}
.present h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:18px;color:var(--ink)}
.present ol{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:14px;font-size:clamp(1.15rem,2.6vw,1.6rem);font-family:var(--display);font-weight:700}
.present li{counter-increment:r;display:flex;gap:14px;align-items:center}
.present li::before{content:counter(r);flex:none;width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.8em;background:var(--k-coral)}
.present li:nth-child(6n+2)::before{background:var(--k-teal)}.present li:nth-child(6n+3)::before{background:var(--k-sun);color:#4A3200}.present li:nth-child(6n+4)::before{background:var(--k-purple)}.present li:nth-child(6n+5)::before{background:var(--k-blue)}.present li:nth-child(6n+6)::before{background:var(--k-pink)}

/* empty + misc */
.empty{border:2.5px dashed var(--edge);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.empty h3{font-size:1.3rem}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.note{background:var(--accent-soft);color:var(--ink);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50;padding-inline:16px}
.toast span{background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:.92rem;font-weight:600;opacity:0;transform:translateY(8px);transition:.2s}
.toast span.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(27,22,48,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal .box{background:var(--surface);border-radius:18px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;border:3px solid var(--edge);box-shadow:5px 5px 0 var(--edge)}
.modal .box p{margin:0;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
"use strict";
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const SECTIONS=["settings","students","attendance","grades","homework","schedule","store","rules"];
const TABS=[
  ["attendance","التحضير اليومي"],["activity","النشاط الفصلي"],["students","كشف الطلاب"],["grades","الاختبارات"],["follow","المتابعة اليومية"],["board","لوحة النقاط"],["homework","الواجبات"],
  ["schedule","جدول المعلم"],["rewards","متجر الجوائز"],["rules","قوانين الفصل"],["setup","الإعدادات"]];
const TAB_COLOR={activity:"pink",follow:"green",board:"teal",attendance:"coral",students:"blue",grades:"teal",homework:"pink",schedule:"purple",rewards:"sun",rules:"green",setup:"gray"};
const ST={p:"حاضر",a:"غائب",l:"متأخر",e:"مستأذن"};
const LS_KEY="teacher-book-v1";

/* 8-bit sound effects synthesized with Web Audio (square/saw oscillators), so no audio files are needed */
const SFX=(()=>{
  const AC=window.AudioContext||window.webkitAudioContext;let ctx=null,on=true;
  try{on=localStorage.getItem("teacher-sfx")!=="off"}catch(e){}
  function note(f,t,d,type,g,f2){
    const o=ctx.createOscillator(),v=ctx.createGain();o.type=type||"square";
    o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g||.1,t+.008);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(v);v.connect(ctx.destination);o.start(t);o.stop(t+d+.03);
  }
  function noise(t,d,g){
    const n=Math.max(1,Math.floor(ctx.sampleRate*d)),buf=ctx.createBuffer(1,n,ctx.sampleRate),a=buf.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=ctx.createBufferSource(),v=ctx.createGain();s.buffer=buf;v.gain.value=g||.1;s.connect(v);v.connect(ctx.destination);s.start(t);
  }
  const S={
    click:t=>{note(1800,t,.012,"square",.05);noise(t,.02,.05)},
    thump:t=>{note(140,t,.24,"triangle",.2,45);noise(t,.08,.08)},
    zap:t=>note(1400,t,.28,"sawtooth",.07,120),
    pow:t=>{noise(t,.38,.16);note(500,t,.3,"square",.07,60)},
    coin:t=>{note(988,t,.07);note(1319,t+.07,.3)},
    win:t=>{[523,659,784,1047].forEach((f,i)=>note(f,t+i*.07,.1))},
    low:t=>{note(196,t,.12,"sawtooth",.09,110);note(131,t+.12,.2,"sawtooth",.09,82)},
    fail:t=>{[392,330,262].forEach((f,i)=>note(f,t+i*.14,.16,"square",.09,f*.7))},
    blip:t=>note(660,t,.05),
    undo:t=>{note(660,t,.05);note(440,t+.05,.08)},
    tick:t=>note(900,t,.025,"square",.05),
    reveal:t=>{[392,523,659,784].forEach((f,i)=>note(f,t+i*.09,.12));note(1047,t+.38,.45)},
    end:t=>{[523,659,784,1047,784,1047].forEach((f,i)=>note(f,t+i*.11,i===5?.5:.12))},
    powerup:t=>note(262,t,.45,"square",.09,1568)
  };
  function play(name){
    if(!on||!S[name]||!AC)return;
    try{if(!ctx)ctx=new AC();if(ctx.state==="suspended")ctx.resume();S[name](ctx.currentTime+.01)}catch(e){}
  }
  function act(a,b){
    let s={award:"coin",undoaward:"undo",undoact:"undo",allp:"win",day:"blip",today:"blip"}[a];
    if(a==="ded")s=b.classList.contains("on")?"undo":"low";
    else if(a==="mark")s=b.dataset.v==="a"?"low":b.classList.contains("on")?"undo":"blip";
    else if(a==="pt")s=Number(b.dataset.n)>0?"coin":"low";
    if(s)play(s);
  }
  function toggle(){on=!on;try{localStorage.setItem("teacher-sfx",on?"on":"off")}catch(e){}}
  return {play,act,toggle,isOn:()=>on};
})();

const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const z=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const fmtDate=(d,opt)=>{try{return d.toLocaleDateString("ar-EG-u-nu-latn",opt||{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return dkey(d)}};
const fmtHijri=d=>{try{return d.toLocaleDateString("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"})}catch(e){return ""}};

function defaults(){
  return {
    settings:{className:"فصلي",teacher:"",subject:"",school:""},
    students:{list:[]},
    attendance:{days:{}},
    grades:{items:[{id:"hw",name:"الواجبات",max:3},{id:"part",name:"المشاركة",max:3},{id:"beh",name:"السلوك",max:5},{id:"rec",name:"التسميع",max:5}],scores:{},
      deductions:[{id:"d1",name:"سلوك سلبي",pts:5,itemId:"beh"},{id:"d2",name:"لم يحفظ",pts:2,itemId:"rec"},{id:"d3",name:"لم يحل الواجب",pts:3,itemId:"hw"},{id:"d4",name:"لم يشارك",pts:1,itemId:"part"}],log:{},
      rounds:[],rscores:{},
      exams:{items:[{id:"e1",name:"اختبار الفترة الأولى",max:""},{id:"e2",name:"اختبار الفترة الثانية",max:""}],scores:{}}},
    homework:{list:[]},
    schedule:{periods:[["الأولى","7:00"],["الثانية","7:45"],["الثالثة","8:30"],["الرابعة","9:35"],["الخامسة","10:20"],["السادسة","11:05"],["السابعة","11:50"]].map(([l,t])=>({id:uid(),label:l,time:t})),cells:{}},
    store:{items:[{id:uid(),name:"اختيار المقعد ليوم كامل",cost:10},{id:uid(),name:"قائد الفصل ليوم",cost:15},{id:uid(),name:"إعفاء من واجب واحد",cost:25},{id:uid(),name:"شهادة تميّز",cost:30}],points:{},log:[],
      awards:[{id:"a1",name:"المشاركة",pts:3},{id:"a2",name:"الواجبات",pts:3},{id:"a3",name:"التسميع",pts:5},{id:"a4",name:"السلوك",pts:5},{id:"a5",name:"السؤال الذهبي",pts:8},{id:"a6",name:"تحفيز",pts:2}],alog:[],actDone:{},actPts:5,actNoRepeat:true,cur:"r1",rounds:[{id:"r1",name:"الجولة الأولى"},{id:"r2",name:"الجولة الثانية"}],archive:{}},
    rules:{list:["أحترم معلمي وزملائي في القول والفعل","أرفع يدي قبل أن أتكلم","أحضر في الوقت المحدد ومعي أدواتي","أحافظ على نظافة الفصل وممتلكاته","أسلّم واجباتي في موعدها","أستمع جيداً عندما يتحدث غيري"].map(t=>({id:uid(),text:t}))}
  };
}
let state=defaults();
let ui={tab:"attendance",date:dkey(new Date()),search:"",openHw:{},present:false,redeemSid:"",loaded:false};

/* ---------- storage ---------- */
const S={mode:"local",db:null,uid:null};
const lastJSON={},dirty={},timers={},chains={};
let localHad={};
function readLocal(){try{const raw=localStorage.getItem(LS_KEY);if(!raw)return null;return JSON.parse(raw)}catch(e){return null}}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function applyLocal(){
  const l=readLocal();if(!l)return;
  for(const s of SECTIONS){if(l[s]){state[s]=Object.assign(defaults()[s],l[s]);localHad[s]=true}}
}
function setSync(s,text){const el=document.getElementById("sync");el.dataset.s=s;el.lastElementChild.textContent=text}
function save(sec){
  dirty[sec]=true;writeLocal();
  if(sec==="students"||sec==="grades"||sec==="store")pushBoard();
  if(S.mode!=="db"){setSync("local","محفوظ على هذا الجهاز فقط");return}
  setSync("busy","يحفظ…");
  clearTimeout(timers[sec]);timers[sec]=setTimeout(()=>flush(sec),500);
}
function flush(sec){
  const js=JSON.stringify(state[sec]);
  if(js===lastJSON[sec]){dirty[sec]=false;setSync("ok","محفوظ في حسابك");return}
  const ref=S.db.collection("data/users/"+S.uid).doc(sec);
  chains[sec]=(chains[sec]||Promise.resolve()).then(()=>ref.set({v:JSON.parse(js)})).then(()=>{
    lastJSON[sec]=js;
    if(JSON.stringify(state[sec])===js)dirty[sec]=false;
    if(!Object.values(dirty).some(Boolean))setSync("ok","محفوظ في حسابك");
  }).catch(e=>{
    dirty[sec]=false;
    setSync("err",e&&e.code==="quota_exceeded"?"امتلأت مساحة الحفظ":"تعذّر الحفظ، تحقق من الاتصال");
  });
}
/* backup file: everything the teacher entered, so it can be moved to another device or restored if the browser clears its storage */
async function exportBackup(){
  const name="teacher-book-"+dkey(new Date())+".json",text=JSON.stringify({app:"teacher-book",v:1,saved:new Date().toISOString(),state},null,1);
  const done=()=>{try{localStorage.setItem("teacher-bk-last",dkey(new Date()))}catch(e){}toast("تم حفظ النسخة الاحتياطية");render()};
  try{
    const dl=window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads"):null;
    if(dl){try{await dl.save({filename:name,data:text});done()}catch(e){if(!e||e.code!=="declined")toast("تعذّر حفظ الملف")}return}
    const blob=new Blob([text],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);done();
  }catch(e){toast("تعذّر تنزيل الملف في هذا المتصفح")}
}
function importBackup(file){
  const rd=new FileReader();
  rd.onerror=()=>toast("تعذّرت قراءة الملف");
  rd.onload=()=>{
    let d;try{d=JSON.parse(rd.result)}catch(e){toast("الملف غير صالح");return}
    const st=d&&d.app==="teacher-book"&&d.state;if(!st||!SECTIONS.some(s=>st[s])){toast("هذا ليس ملف نسخة احتياطية من دفتر المعلم");return}
    confirmBox("استعادة النسخة الاحتياطية؟ ستحل محل البيانات الحالية.","استعادة",()=>{
      for(const s of SECTIONS)if(st[s]){state[s]=Object.assign(defaults()[s],st[s]);save(s)}
      toast("تمت الاستعادة");render();
    });
  };
  rd.readAsText(file);
}
window.addEventListener("pagehide",()=>{try{writeLocal()}catch(e){}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)try{writeLocal()}catch(e){}});
async function initStorage(){
  let db=null,user=null,id=null;
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(db&&user)id=await user.id();
    }
  }catch(e){}
  if(!db||!id){ui.loaded=true;setSync("local","محفوظ على هذا الجهاز فقط");setupOnce();render();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}return}
  if(!user.isOwner()){
    ui.student=true;ui.loaded=true;
    db.doc("board/live").onSnapshot(snap=>{ui.board=snap.exists?snap.data().v:null;render()},()=>{ui.board=null;render()});
    render();return;
  }
  S.mode="db";S.db=db;S.uid=id;
  let migrated=false;
  const t=setTimeout(()=>{if(!ui.loaded){setSync("err","لم نتمكن من الوصول لبياناتك بعد");ui.loaded=true;render()}},10000);
  db.collection("data/users/"+id).onSnapshot(snap=>{
    let changed=false;const seen=new Set();
    for(const d of snap.docs){
      if(!SECTIONS.includes(d.id))continue;seen.add(d.id);
      if(dirty[d.id])continue;
      const body=d.data();if(!body||body.v==null)continue;
      const js=JSON.stringify(body.v);
      if(js!==lastJSON[d.id]){lastJSON[d.id]=js;state[d.id]=Object.assign(defaults()[d.id],JSON.parse(js));changed=true}
    }
    if(!snap.metadata.fromCache){
      clearTimeout(t);
      if(!migrated){migrated=true;for(const s of SECTIONS)if(!seen.has(s)&&localHad[s])save(s);setupOnce();changed=true}
      if(!Object.values(dirty).some(Boolean))setSync("ok","محفوظ في حسابك");
      if(!ui.loaded){ui.loaded=true;changed=true}
    }
    if(changed){writeLocal();render()}
  },e=>{clearTimeout(t);ui.loaded=true;setSync("err","انقطع الاتصال بالحفظ، أعد فتح الصفحة");render()});
}

/* an empty grade cell means full marks; deductions logged in daily attendance subtract from their linked item */
/* rounds: teacher-set periods (start/end date-time). Each round restarts at full marks and only counts deductions dated inside it;
   "all" sums the rounds, or covers the whole term when no rounds are set */
const ORD=["الأولى","الثانية","الثالثة","الرابعة","الخامسة","السادسة","السابعة","الثامنة","التاسعة","العاشرة"];
const rounds=()=>state.grades.rounds;
const roundById=id=>rounds().find(x=>x.id===id);
const inRound=(k,r)=>!!r&&k>=String(r.start).slice(0,10)&&k<=String(r.end).slice(0,10);
const roundForDate=k=>rounds().find(r=>inRound(k,r));
function roundNow(){const t=Date.now();return rounds().find(r=>new Date(r.start)<=t&&t<=new Date(r.end))}
function curGRound(){
  if(ui.gRound==="all"||roundById(ui.gRound))return ui.gRound;
  const n=roundNow();return n?n.id:rounds().length?rounds()[rounds().length-1].id:"all";
}
function dedTotals(sid,r){
  const out={},deds=state.grades.deductions,log=state.grades.log;
  for(const k in log){if(r&&!inRound(k,r))continue;if(!r&&rounds().length&&!roundForDate(k))continue;
    for(const did of (log[k][sid]||[])){const d=deds.find(x=>x.id===did);if(d)out[d.itemId]=(out[d.itemId]||0)+(Number(d.pts)||0)}}
  return out;
}
function scoresFor(sid,rid){const src=rid&&rid!=="all"?(state.grades.rscores[rid]||{}):state.grades.scores;return src[sid]||{}}
const AWARD_ITEM={a1:"part",a2:"hw",a3:"rec",a4:"beh"};
/* points given with the matching award buttons count toward that grade item, dated inside the same round */
function gainTotals(sid,r){
  const out={};
  for(const l of state.store.alog){if(l.sid!==sid)continue;const it=AWARD_ITEM[l.aid];if(!it)continue;
    if(r?!inRound(l.date,r):(rounds().length&&!roundForDate(l.date)))continue;out[it]=(out[it]||0)+(Number(l.pts)||0)}
  return out;
}
function itemScore(it,sc,dt,gn){const base=Number(sc[it.id])||0;return Math.min(Number(it.max)||0,Math.max(0,base+(gn[it.id]||0)-(dt[it.id]||0)))}
const pctOf=(got,max)=>max?Math.round(got/max*1000)/10:0;
function gradeTotal(sid,rid){
  rid=rid||"all";
  if(rid==="all"&&rounds().length){let got=0,max=0;rounds().forEach(r=>{const g=gradeTotal(sid,r.id);got+=g.got;max+=g.max});return {got:Math.round(got*10)/10,max,pct:pctOf(got,max)}}
  const r=rid==="all"?null:roundById(rid),dt=dedTotals(sid,r),gn=gainTotals(sid,r),sc=scoresFor(sid,rid);let got=0,max=0;
  for(const it of state.grades.items){max+=Number(it.max)||0;got+=itemScore(it,sc,dt,gn)}
  return {got:Math.round(got*10)/10,max,pct:pctOf(got,max)};
}
function untilText(ms){
  const m=Math.max(0,Math.floor(ms/60000)),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;
  return d?`${d} يوم${h?` و${h} ساعة`:""}`:h?`${h} ساعة${mi?` و${mi} دقيقة`:""}`:`${mi} دقيقة`;
}
function roundStatus(){
  const t=Date.now(),n=roundNow();
  if(n)return `${n.name} · تنتهي بعد ${untilText(new Date(n.end)-t)}`;
  const next=rounds().filter(r=>new Date(r.start)>t).sort((a,b)=>new Date(a.start)-new Date(b.start))[0];
  if(next)return `${next.name} تبدأ بعد ${untilText(new Date(next.start)-t)}`;
  return rounds().length?"لا توجد جولة جارية":"";
}
function rating(p){return p>=90?["ممتاز","r5"]:p>=80?["جيد جداً","r4"]:p>=65?["جيد","r3"]:p>=50?["مقبول","r2"]:["يحتاج دعماً","r1"]}
const points=sid=>Number(state.store.points[sid])||0;
/* award buttons add reward points; each grant is logged with its date so it can be shown per day and undone */
/* "once a day" awards: pressing the button again cancels the point, so a wrong tap is easy to take back */
const onceAward=a=>a.once!==undefined?!!a.once:(a.id==="a1"||a.id==="a2");
function award(sid,aid,date){
  const a=state.store.awards.find(x=>x.id===aid);if(!a)return;
  state.store.points[sid]=points(sid)+(Number(a.pts)||0);
  state.store.alog.push({id:uid(),sid,aid,name:a.name,pts:Number(a.pts)||0,date:date||dkey(new Date()),t:Date.now()});
  state.store.alog=state.store.alog.slice(-600);save("store");
}
function unaward(lid){
  const l=state.store.alog.find(x=>x.id===lid);if(!l)return;
  state.store.points[l.sid]=Math.max(0,points(l.sid)-l.pts);

/* manual correction: positive adds, negative deducts (never below 0); logged so it can be undone from the recent list */
function manualPoints(sid,delta,reason){
  const before=points(sid),after=Math.max(0,before+delta),applied=after-before;
  if(!applied)return 0;
  state.store.points[sid]=after;
  state.store.alog.push({id:uid(),sid,aid:"manual",name:reason||"تصحيح يدوي",pts:applied,date:dkey(new Date()),t:Date.now()});
  state.store.alog=state.store.alog.slice(-600);save("store");return applied;
}

function examTotal(sid){
  const ex=state.grades.exams,sc=ex.scores[sid]||{};let got=0,max=0,any=false;
  for(const e of ex.items){max+=Number(e.max)||0;if(sc[e.id]!=null){got+=Number(sc[e.id])||0;any=true}}
  return {got:Math.round(got*10)/10,max,any};
}

/* random picker: round 1 draws from everyone present; a skipped student is parked until round 2, which draws only from the skipped */
const blankPick=()=>({round:1,done:[],skipped:[],done2:[],fail:[],cur:null});
const getPick=date=>(state.attendance.picks||{})[date]||blankPick();

function pickInfo(date){
  const p=getPick(date),day=state.attendance.days[date]||{};
  const all=sortedStudents().filter(s=>day[s.id]!=="a"&&day[s.id]!=="e");
  const ids=new Set(all.map(s=>s.id)),clean=a=>(a||[]).filter(id=>ids.has(id));
  const done=clean(p.done),skipped=clean(p.skipped),done2=clean(p.done2),fail=clean(p.fail);
  return {p,all,done,skipped,done2,fail,cur:all.find(s=>s.id===p.cur),
    pool1:all.filter(s=>!done.includes(s.id)&&!skipped.includes(s.id)),
    pool2:all.filter(s=>skipped.includes(s.id)&&!done2.includes(s.id)&&!fail.includes(s.id))};
}

/* classroom activity: lit tiles chase across the present students and stop on one winner, who gets points.
   Sounds are noise clicks, a zap, a thump and a pow, not melodies. */
const todayKey=()=>dkey(new Date());
function actPool(){
  const key=todayKey(),day=state.attendance.days[key]||{};
  const all=sortedStudents().filter(s=>day[s.id]!=="a"&&day[s.id]!=="e");
  const done=((state.store.actDone||{})[key])||[];
  return {all,done,fresh:all.filter(s=>!done.includes(s.id))};
}
function spinPlan(n,w){const i0=Math.floor(Math.random()*n),laps=Math.max(1,Math.ceil(20/n));return {i0,total:((w-i0+n)%n)+laps*n}}
function actGive(s){
  const pts=Number(state.store.actPts)>0?Number(state.store.actPts):5,key=todayKey();
  state.store.points[s.id]=points(s.id)+pts;
  state.store.alog.push({id:uid(),sid:s.id,aid:"activity",name:"النشاط الفصلي",pts,date:key,t:Date.now()});
  state.store.alog=state.store.alog.slice(-600);
  const ad=state.store.actDone||(state.store.actDone={});(ad[key]||(ad[key]=[])).push(s.id);
  save("store");ui.actWinner={sid:s.id,pts,date:key};toast(`${s.name}: +${pts}`);render();
}
function runActivity(){
  if(ui.spinning)return;
  const A=actPool(),pool=state.store.actNoRepeat!==false?A.fresh:A.all;
  if(!pool.length){toast("لا يوجد طلاب متاحون للسحب");return}
  const win=pool[Math.floor(Math.random()*pool.length)],n=pool.length,{i0,total}=spinPlan(n,pool.indexOf(win));
  const board=document.getElementById("actBoard"),tiles=pool.map(s=>board&&board.querySelector(`[data-sid="${s.id}"]`));
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  ui.spinning=true;ui.actWinner=null;
  const finish=()=>{ui.spinning=false;actGive(win)};
  SFX.play("zap");
  if(!board||reduce||tiles.some(t=>!t)){setTimeout(()=>{SFX.play("thump");SFX.play("pow");finish()},300);return}
  const go=document.querySelector(".act-go");if(go)go.disabled=true;
  const wm=document.querySelector(".act-win");if(wm)wm.remove();
  let step=0,prev=null;
  const tick=()=>{
    if(prev)prev.classList.remove("lit");
    const el=tiles[(i0+step)%n];el.classList.add("lit");prev=el;SFX.play("click");
    if(step>=total){
      el.classList.remove("lit");el.classList.add("won");
      setTimeout(()=>{SFX.play("thump");setTimeout(()=>SFX.play("pow"),140)},60);setTimeout(finish,950);return;
    }
    step++;setTimeout(tick,30+Math.pow(step/total,3)*260);
  };
  tick();
}

/* names fill the placeholder slots first (in roster order), then extend the roster */
function addStudents(names){
  const slots=sortedStudents().filter(s=>s.slot);let last=null;
  let n=students().reduce((m,s)=>Math.max(m,Number(s.num)||0),0);
  names.map(x=>x.trim()).filter(Boolean).forEach(name=>{
    const sl=slots.shift();
    if(sl){sl.name=name;delete sl.slot;last=sl}
    else{last={id:uid(),name,num:++n,notes:""};students().push(last)}
  });
  save("students");return last;
}
/* roster import: Noor's name report lays each student out as [name, number]; header rows carry "value : label" */
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>window.XLSX?res(window.XLSX):rej();s.onerror=rej;document.head.appendChild(s)});
}
function parseRoster(rows){
  const list=[],info={},seen=new Set();
  for(const r of rows){
    const v=r.map(c=>String(c??"").replace(/\s+/g," ").trim()).filter(Boolean);if(!v.length)continue;
    const numI=v.findIndex(x=>/^\d{1,3}$/.test(x));
    const name=v.find(x=>/[؀-ۿ]/.test(x)&&x.split(" ").length>=2&&x.length<70&&!x.includes(":"));
    if(numI>=0&&name&&v.length<=4&&!v.includes(":")){if(!seen.has(name)){seen.add(name);list.push({num:Number(v[numI]),name})}continue}
    if(v.includes(":")&&v.length>=3){
      const pair=(lab)=>v[0].includes(lab)?v[v.length-1]:v[v.length-1].includes(lab)?v[0]:null;
      info.grade=info.grade||pair("الصف");info.cls=info.cls||pair("الفصل");info.dept=info.dept||pair("القسم");
    }else if(v.length===1&&/(ابتدائية|متوسطة|ثانوية|مدرسة|مدارس)/.test(v[0]))info.school=v[0];
  }
  return {list:list.sort((a,b)=>a.num-b.num),info};
}
function applyRoster(r){
  const slots=sortedStudents().filter(s=>s.slot),have=new Set(students().map(s=>s.name));let added=0;
  r.list.forEach(x=>{if(have.has(x.name))return;const sl=slots.shift();
    if(sl){sl.name=x.name;sl.num=x.num;delete sl.slot}else students().push({id:uid(),name:x.name,num:x.num,notes:""});added++});
  if(slots.length)removeIds(slots.map(s=>s.id));
  const st=state.settings;
  if(r.info.grade&&(!st.className||st.className==="فصلي"))st.className=r.info.grade+(r.info.cls?" / "+r.info.cls:"");
  if(r.info.school&&!st.school)st.school=r.info.school;
  if(r.info.dept&&!st.subject)st.subject=r.info.dept;
  save("students");save("settings");return added;
}
async function importFile(file){
  const msg=t=>{const el=document.getElementById("xlsxMsg");if(el)el.textContent=t};
  msg("جارٍ قراءة الملف…");
  try{
    const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:"array"});
    let best={list:[],info:{}};
    for(const n of wb.SheetNames){const r=parseRoster(X.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""}));if(r.list.length>best.list.length)best=r}
    if(!best.list.length){msg("لم نجد أسماء طلاب في هذا الملف. تأكد أنه كشف الأسماء، أو الصق الأسماء يدوياً.");return}
    msg("");
    const where=[best.info.grade,best.info.cls&&("فصل "+best.info.cls)].filter(Boolean).join(" ");
    confirmBox(`وجدنا ${best.list.length} طالباً في الملف${where?" ("+where+")":""}، أولهم ${best.list[0].name}. استيراد الأسماء إلى الكشف؟`,"استيراد",()=>{
      const n=applyRoster(best);toast(n?`استُورد ${n} طالباً`:"كل الأسماء موجودة في الكشف مسبقاً");render()});
  }catch(e){msg("تعذّرت قراءة الملف. جرّب حفظه بصيغة xlsx ثم اختره مرة أخرى.")}
}

function removeIds(ids){
  const set=new Set(ids);
  state.students.list=students().filter(s=>!set.has(s.id));
  for(const k in state.attendance.days)ids.forEach(id=>delete state.attendance.days[k][id]);
  ids.forEach(id=>{delete state.grades.scores[id];delete state.store.points[id]});
  state.store.alog=state.store.alog.filter(l=>!set.has(l.sid));
  for(const k in state.grades.log)ids.forEach(id=>delete state.grades.log[k][id]);
  for(const k in state.grades.rscores)ids.forEach(id=>delete state.grades.rscores[k][id]);
  ids.forEach(id=>delete state.grades.exams.scores[id]);
  state.homework.list.forEach(h=>ids.forEach(id=>h.done&&delete h.done[id]));
  ["students","attendance","grades","store","homework"].forEach(save);
}

    case "day":{const d=parseKey(ui.date);d.setDate(d.getDate()-Number(b.dataset.d));ui.date=dkey(d);render();break}
    case "today":ui.date=dkey(new Date());render();break;
    case "delstu":{const s=stuById(id);confirmBox(`حذف ${s.name} من الكشف مع حضوره ودرجاته ونقاطه؟`,"حذف",()=>{removeIds([id]);toast("حُذف الطالب");render()});break}
    case "delgi":{const it=state.grades.items.find(x=>x.id===id);confirmBox(`حذف بند "${it.name}" ودرجاته لجميع الطلاب؟`,"حذف",()=>{state.grades.items=state.grades.items.filter(x=>x.id!==id);for(const k in state.grades.scores)delete state.grades.scores[k][id];state.grades.deductions=state.grades.deductions.filter(d=>d.itemId!==id);save("grades");render()});break}
    case "hwtoggle":ui.openHw[id]=!ui.openHw[id];render();break;
    case "hwall":case "hwnone":{const h=state.homework.list.find(x=>x.id===id);h.done={};if(a==="hwall")students().forEach(s=>h.done[s.id]=true);save("homework");render();break}
    case "delhw":confirmBox("حذف هذا الواجب وسجل تسليمه؟","حذف",()=>{state.homework.list=state.homework.list.filter(x=>x.id!==id);save("homework");render()});break;
    case "delp":confirmBox("حذف هذه الحصة من الجدول؟","حذف",()=>{state.schedule.periods=state.schedule.periods.filter(x=>x.id!==id);for(const k in state.schedule.cells)if(k.endsWith("-"+id))delete state.schedule.cells[k];save("schedule");render()});break;
    case "pt":{const sid=b.dataset.sid;state.store.points[sid]=Math.max(0,points(sid)+Number(b.dataset.n));save("store");render();break}
    case "redeem":{const it=state.store.items.find(x=>x.id===id),s=stuById(ui.redeemSid);if(!it||!s)break;
      if(hasQty(it)&&Number(it.qty)<=0){toast("نفدت كمية هذه الجائزة");render();break}
      confirmBox(`استبدال "${it.name}" لـ ${s.name} مقابل ${it.cost} نقطة؟`,"تأكيد الاستبدال",()=>{if(hasQty(it)&&Number(it.qty)<=0){toast("نفدت كمية هذه الجائزة");render();return}
        SFX.play("powerup");if(hasQty(it))it.qty=Number(it.qty)-1;state.store.points[s.id]=points(s.id)-Number(it.cost);
        state.store.log.push({sid:s.id,item:it.name,cost:Number(it.cost),date:dkey(new Date())});state.store.log=state.store.log.slice(-200);save("store");toast(hasQty(it)&&it.qty<=0?`حصل ${s.name} على: ${it.name} — نفدت الكمية`:`حصل ${s.name} على: ${it.name}`);render()});break}
    case "delrr":state.store.rateRules=rrules().filter(x=>x.id!==id);save("store");render();break;
    case "delsi":state.store.items=state.store.items.filter(x=>x.id!==id);save("store");render();break;
    case "present":ui.present=!ui.present;render();break;
    case "mvrule":{const l=state.rules.list,i=l.findIndex(x=>x.id===id),j=i+Number(b.dataset.d);if(j<0||j>=l.length)break;[l[i],l[j]]=[l[j],l[i]];save("rules");render();break}
    case "delrule":state.rules.list=state.rules.list.filter(x=>x.id!==id);save("rules");render();break;
    case "newterm":confirmBox("بدء فصل دراسي جديد؟ سيُمسح الحضور والدرجات والواجبات والنقاط.","بدء فصل جديد",()=>{state.attendance={days:{}};state.grades.scores={};state.grades.log={};state.grades.rscores={};state.grades.rounds=[];state.grades.exams.scores={};state.homework={list:[]};state.store.points={};state.store.log=[];state.store.alog=[];state.store.actDone={};state.store.archive={};state.store.cur="r1";["attendance","grades","homework","store"].forEach(save);toast("بدأ فصل دراسي جديد");render()});break;
    case "zeropts":confirmBox(`تصفير نقاط جميع الطلاب في "${roundName(state.store.cur)}"؟ لا يمكن التراجع، ويُنصح بتنزيل نسخة احتياطية أولاً.`,"تصفير النقاط",()=>{state.store.points={};state.store.alog=[];state.store.log=[];state.store.actDone={};ui.actWinner=null;save("store");toast("صُفّرت جميع النقاط");render()});break;
    case "wipe":confirmBox("مسح كل البيانات نهائياً، بما فيها الطلاب والجدول والقوانين؟","مسح الكل",()=>{state=defaults();state.grades.v=2;SECTIONS.forEach(save);toast("مُسحت البيانات");go("attendance")});break;
  }
});

document.addEventListener("input",e=>{
  const t=e.target,f=t.dataset.f;
  if(t.id==="stuSearch"){ui.search=t.value;render();return}
  if(!f)return;const id=t.dataset.id;
  const find=(arr)=>arr.find(x=>x.id===id);
  switch(f){
    case "stu-name":{const s=find(students());s.name=t.value;delete s.slot;save("students");break}
    case "dd-name":find(state.grades.deductions).name=t.value;save("grades");break;
    case "dd-pts":find(state.grades.deductions).pts=Number(t.value)||0;save("grades");break;
    case "dd-item":find(state.grades.deductions).itemId=t.value;save("grades");break;
    case "stu-num":find(students()).num=t.value;save("students");break;
    case "stu-notes":find(students()).notes=t.value;save("students");break;
    case "gi-name":find(state.grades.items).name=t.value;save("grades");break;
    case "gi-max":find(state.grades.items).max=Number(t.value)||0;save("grades");break;
    case "act-pts":state.store.actPts=Number(t.value)>0?Math.round(Number(t.value)):5;save("store");break;
    case "ex-name":find(state.grades.exams.items).name=t.value;save("grades");break;
    case "ex-max":{const ex=state.grades.exams;find(ex.items).max=t.value===""?"":Number(t.value)||0;
      document.querySelectorAll('input[data-f="ex-max"]').forEach(i=>{if(i.dataset.id===id&&i!==t)i.value=t.value});
      document.querySelectorAll('input[data-f="exam"]').forEach(i=>{if(i.dataset.eid===id)i.max=t.value});
      document.querySelectorAll('[data-cell="etot"]').forEach(td=>{td.textContent=examText(td.closest("tr").dataset.row)});
      const sum=ex.items.reduce((a,e)=>a+(Number(e.max)||0),0),ms=document.getElementById("exMaxSum");if(ms)ms.textContent=sum>0?sum:"";
      save("grades");break}
    case "exam":{const ex=state.grades.exams,sid=t.dataset.sid,sc=ex.scores[sid]||(ex.scores[sid]={});
      if(t.value==="")delete sc[t.dataset.eid];else sc[t.dataset.eid]=Number(t.value);
      const e=ex.items.find(x=>x.id===t.dataset.eid);t.style.borderColor=Number(e.max)>0&&Number(t.value)>Number(e.max)?"var(--bad)":"";
      t.closest("tr").querySelector('[data-cell="etot"]').textContent=examText(sid);save("grades");break}
    case "r-name":find(rounds()).name=t.value;save("grades");break;
    case "r-start":case "r-end":if(t.value){find(rounds())[f==="r-start"?"start":"end"]=t.value;rounds().sort((a,b)=>String(a.start).localeCompare(String(b.start)));save("grades");renderHeader()}break;
    case "grade":{const sid=t.dataset.sid,rid=curGRound(),bag=rid==="all"?state.grades.scores:(state.grades.rscores[rid]||(state.grades.rscores[rid]={})),sc=bag[sid]||(bag[sid]={});
      if(t.value==="")delete sc[t.dataset.iid];else sc[t.dataset.iid]=Number(t.value);
      const it=state.grades.items.find(x=>x.id===t.dataset.iid);t.style.borderColor=Number(t.value)>Number(it.max)?"var(--bad)":"";
      const g=gradeTotal(sid,rid),r=rating(g.pct),row=t.closest("tr");
      row.querySelector('[data-cell="tot"]').textContent=g.got+"/"+g.max;row.querySelector('[data-cell="pct"]').innerHTML=pctCell(g.pct);
      row.querySelector('[data-cell="rate"]').innerHTML=`<span class="pill ${r[1]}">${r[0]}</span>`;save("grades");break}
    case "hwdone":{const h=find(state.homework.list);h.done=h.done||{};if(t.checked)h.done[t.dataset.sid]=true;else delete h.done[t.dataset.sid];save("homework");render();break}
    case "cell":if(t.value.trim())state.schedule.cells[t.dataset.k]=t.value;else delete state.schedule.cells[t.dataset.k];save("schedule");break;
    case "p-label":find(state.schedule.periods).label=t.value;save("schedule");break;
    case "p-time":find(state.schedule.periods).time=t.value;save("schedule");break;
    case "aw-name":find(state.store.awards).name=t.value;save("store");break;
    case "aw-pts":find(state.store.awards).pts=Math.max(1,Number(t.value)||1);save("store");break;
    case "si-name":find(state.store.items).name=t.value;save("store");break;
    case "aw-once":find(state.store.awards).once=t.checked;save("store");break;
    case "rr-op":find(rrules()).op=t.value;save("store");break;
    case "rr-val":find(rrules()).val=t.value===""?"":Number(t.value);save("store");break;
    case "rr-label":find(rrules()).label=t.value.trim();save("store");break;
    case "rr-color":find(rrules()).color=t.value;save("store");break;
    case "si-qty":{const it=find(state.store.items);it.qty=t.value===""?"":Math.max(0,Math.floor(Number(t.value))||0);save("store");break}
    case "si-cost":find(state.store.items).cost=Math.max(1,Number(t.value)||1);save("store");break;
    case "rule":find(state.rules.list).text=t.value;save("rules");break;
    case "set":state.settings[t.dataset.k]=t.value;save("settings");renderHeader();break;
    case "web-url":setWebCfg("url",t.value.trim());break;
    case "web-secret":setWebCfg("secret",t.value);break;
    case "web-full":setWebCfg("full",t.checked);break;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="attDate"&&t.value){ui.date=t.value;render()}
  if(t.dataset&&(t.dataset.f==="si-qty"||/^(rr|web)-/.test(t.dataset.f||"")))render();
  if(t.id==="redeemStu"){ui.redeemSid=t.value;render()}
  if(t.id==="fixStu")ui.fixSid=t.value;
  if(t.id==="roundSel"){const to=t.value;
    if(to===state.store.cur)return;
    if((state.store.archive||{})[to]){switchRound(to);return}
    confirmBox(`الدخول إلى "${roundName(to)}" للمرة الأولى؟ ستبدأ النقاط والمتابعة من الصفر، وتبقى بيانات "${roundName(state.store.cur)}" محفوظة ويمكنك الرجوع إليها من القائمة.`,"ابدأ من الصفر",()=>switchRound(to));
    t.value=state.store.cur;return}
  if(t.id==="bkFile"){if(t.files[0])importBackup(t.files[0]);t.value="";return}
  if(t.id==="actNoRep"){state.store.actNoRepeat=t.checked;save("store");render()}
  if(t.id==="xlsxFile"&&t.files&&t.files[0]){importFile(t.files[0]);t.value=""}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const id=e.target.id;const val=x=>document.getElementById(x).value.trim();
  switch(id){
    case "fixForm":{const sid=val("fixStu"),amt=Math.round(Number(document.getElementById("fixAmt").value));
      if(!sid||!amt){toast("اختر الطالب واكتب عدداً غير الصفر");return}
      const d=manualPoints(sid,amt,val("fixWhy"));ui.fixSid=sid;
      if(d){SFX.play(d>0?"coin":"low");toast(`${(stuById(sid)||{}).name}: ${d>0?"+":""}${d}`)}else toast("الرصيد صفر بالفعل");render();break}
    case "addEx":state.grades.exams.items.push({id:uid(),name:val("exName"),max:Number(val("exMax"))||20});save("grades");render();break;
    case "addRound":{const st=val("rStart"),en=val("rEnd");if(!st||!en)return;
      if(en<=st){toast("يجب أن تكون نهاية الجولة بعد بدايتها");return}
      const nr={id:uid(),name:val("rName"),start:st,end:en};rounds().push(nr);rounds().sort((a,b)=>String(a.start).localeCompare(String(b.start)));
      ui.gRound=nr.id;save("grades");toast("أُضيفت "+nr.name);render();renderHeader();break}
    case "addDd":state.grades.deductions.push({id:uid(),name:val("ddName"),pts:Number(val("ddPts"))||0,itemId:val("ddItem")});save("grades");render();break;
    case "addStu":{const name=val("newName");if(!name)return;const num=val("newNum");const s=addStudents([name]);if(num&&s)s.num=num;save("students");toast("أُضيف "+name);render();document.getElementById("newName").focus();break}
    case "bulkStu":{const names=document.getElementById("bulkNames").value.split(/\n|،|,/).map(x=>x.trim()).filter(Boolean);if(!names.length)return;addStudents(names);toast("أُضيف "+names.length+" طالب");render();break}
    case "addGi":state.grades.items.push({id:uid(),name:val("giName"),max:Number(val("giMax"))||10});save("grades");render();break;
    case "addHw":state.homework.list.push({id:uid(),title:val("hwTitle"),due:val("hwDue"),desc:val("hwDesc"),done:{}});save("homework");toast("أُضيف الواجب");render();break;
    case "addP":state.schedule.periods.push({id:uid(),label:val("pLabel"),time:val("pTime")});save("schedule");render();break;
    case "addAw":state.store.awards.push({id:uid(),name:val("awName"),pts:Math.max(1,Number(val("awPts"))||1)});save("store");toast("أُضيف زر "+val("awName"));render();break;
    case "addRr":rrules().push({id:uid(),op:val("rrOp"),val:Number(val("rrVal")),label:val("rrLabel"),color:val("rrColor")});save("store");render();break;
    case "addSi":state.store.items.push({id:uid(),name:val("siName"),cost:Math.max(1,Number(val("siCost"))||1),qty:val("siQty")===""?"":Math.max(1,Math.floor(Number(val("siQty")))||1)});save("store");render();break;
    case "addRule":state.rules.list.push({id:uid(),text:val("ruleText")});save("rules");render();document.getElementById("ruleText").focus();break;
  }
});

/* ---------- boot ---------- */
document.documentElement.setAttribute("dir","rtl");document.documentElement.setAttribute("lang","ar");
const boardParam=new URLSearchParams(location.search).get("board");
if(boardParam&&/^[\w-]{20,}$/.test(boardParam)){webStudent(boardParam);return}
const h=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h))ui.tab=h;
applyLocal();
if(students().length)ui.loaded=true;
render();
initStorage();
})();
</script>
